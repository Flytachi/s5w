services:
  server:
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME:-app}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEV: ${DEV:-false}
      LOG_LEVEL: debug
      PUBLIC_BASE_URL: ''
      ADMIN_UI: ${ADMIN_UI:-true}
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
    stop_grace_period: 45s
    ports:
      - "9090:9090"   # API and delivery
      - "9091:9091"   # admin panel
    volumes:
      - ./:/app/
      - s5w_data:/var/lib/s5w

volumes:
  s5w_data:
