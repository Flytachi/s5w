# The port lives here and nowhere else. Change this one number and both the published
# port and the port the application binds follow — they are the same anchor below.
#
# The `${SERVER_PORT:-…}` form keeps an escape hatch: set SERVER_PORT in the environment
# (or in .env) and it wins without this file being touched, which is usually what a
# production host wants.
x-port: &port ${SERVER_PORT:-9090}

services:
  server:
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME:-app}
    network_mode: bridge
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COMPOSE_BAKE: "true"
      SERVER_PORT: *port
      DEV: ${DEV:-false}

      WINTER_KEY: 4a7d0e413019fa0e393376bc0e3ad8ba637acb37a352964c1d9c8d0fe037ec33
      TIME_ZONE: UTC
      DEBUG: true

      LOG_LEVEL: debug

      DB_HOST: 62.113.58.80
      DB_PORT: 5432
      DB_NAME: s4w
      DB_USER: admin
      DB_PASS: "jfviug5Fir594kjYYz12"
      DB_SCHEMA: new

      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
    ports:
      - target: *port
        published: *port
    volumes:
      - ./:/var/www/html/
