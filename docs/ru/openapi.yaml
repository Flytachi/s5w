                name: notes.txt
                folder: null
                content:
                  size: 99
                  mime: text/plain
                  extension: txt
                  hash: 81e2bc55904154f76a08b9e7564031bf73c6015f8253fad9a51efa42e3eaabc4
                public: true
                deduplicated: false
                processed:
                  applied: false
                  reason: no options
                expiresAt: null
                privateUrl: https://s5.example.com/p/d_QSaL4bHSBG02ri
                publicUrl: https://s5.example.com/o/26cf7ca6-fa2b-410a-887f-1ed75396531d/d_QSaL4bHSBG02ri
                createdAt: '2026-11-07T21:21:10+00:00'
                updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
