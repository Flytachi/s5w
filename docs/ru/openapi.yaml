              - id: 1
                url: https://s5.example.com/t/AQAAAAAAAAADavDnxgMAAAABAAAAAAAAAAE03U_0Q532vTqsB62CC3c9
                expiresAt: '2026-11-08T21:21:10+00:00'
                revocable: true
                maxDownloads: 3
                downloads: 0
