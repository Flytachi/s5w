              schema:
                $ref: '#/components/schemas/Error'
  /t/{token}:
    get:
      tags:
      - Раздача
      operationId: getTemporary
      summary: Открыть временную ссылку
      description: Отдаёт файл по временной ссылке без токена. После срока, отзыва или исчерпания лимита — `404`.
        Открыть или скачать — задаётся при выдаче полем `disposition`.
      security: []
