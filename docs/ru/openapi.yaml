                message: Link is invalid or has expired
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: Токен бакета из админ-панели, вида `s5w_…`. `BASIC` открывает `GET /v1/check` и `/p/{id}`; `FULL`
        — всё.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: HTTP-код ответа.
        message:
          type: string
          description: Что пошло не так — по-английски, для журнала и разработчика.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Только при ошибке проверки параметров: сообщения по каждому полю.'
      required:
      - code
      - message
    PageMeta:
      type: object
      properties:
        current:
          type: integer
          description: Текущая страница.
        size:
          type: integer
          description: Размер страницы.
        total:
          type: integer
          description: Всего записей.
        pages:
          type: integer
          description: Всего страниц.
        previous:
          type:
          - integer
          - 'null'
          description: Предыдущая страница или `null`.
        next:
          type:
          - integer
          - 'null'
          description: Следующая страница или `null`.
      required:
      - current
      - size
      - total
      - pages
      - previous
      - next
    Named:
      type: object
      properties:
        id:
          type: integer
          description: Значение.
        name:
          type: string
          description: Имя значения.
      required:
      - id
      - name
    Check:
      type: object
      properties:
        bucket:
          type: object
          properties:
            id:
              type: string
              description: Идентификатор бакета.
            name:
              type: string
              description: Имя бакета.
          description: Бакет, которому выдан токен.
        access:
          $ref: '#/components/schemas/Named'
          description: 'Уровень токена: `1` BASIC, `2` FULL.'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Когда истекает токен; `null` — бессрочный.
        bytes:
          type: object
          properties:
            quota:
              type: integer
              description: Квота.
            used:
              type: integer
              description: Занято.
            free:
              type: integer
              description: Свободно.
          description: Место в бакете, в байтах.
      required:
      - bucket
      - access
      - expiresAt
      - bytes
    File:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор файла, 16 символов. Нужен во всех остальных запросах.
        name:
          type: string
          description: Имя файла.
        folder:
          type:
          - string
          - 'null'
          description: Имя папки; `null` — корень бакета.
        content:
          type: object
          properties:
            size:
              type: integer
              description: Размер в байтах.
            mime:
              type: string
              description: MIME-тип.
            extension:
              type: string
              description: Расширение.
            hash:
              type: string
              description: SHA-256 содержимого.
          description: Содержимое.
        public:
          type: boolean
          description: Открывается ли без токена по `publicUrl`.
        deduplicated:
          type: boolean
          description: '`true` — такое содержимое уже было в бакете, место не потрачено.'
        processed:
          oneOf:
          - $ref: '#/components/schemas/ProcessedImage'
          - type: 'null'
          description: Что сделала обработка картинки; `null`, если её не просили.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Когда удалится по сроку папки; `null` — бессрочно.
        privateUrl:
          type: string
          description: Скачивание по токену — `/p/{id}`.
        publicUrl:
          type:
          - string
          - 'null'
          description: Публичный адрес `/o/{bucketId}/{id}`; `null`, если файл не публичный.
        createdAt:
          type: string
          format: date-time
          description: Когда загружен.
        updatedAt:
          type: string
          format: date-time
          description: Когда изменён.
      required:
      - id
      - name
      - folder
      - content
      - public
      - deduplicated
      - processed
      - expiresAt
      - privateUrl
      - publicUrl
      - createdAt
      - updatedAt
    ProcessedImage:
      type: object
      properties:
        applied:
          type: boolean
          description: Была ли обработка.
        reason:
          type: string
          description: 'Почему не было: `no options`, `animated`, `nothing to do`, `output is larger than source`.'
        operations:
          type: array
          items:
            type: string
          description: 'Что сделано: `resize:800x533`, `exif-rotate`, `encode:webp@82`.'
        source:
          $ref: '#/components/schemas/ImageInfo'
          description: Исходная картинка.
        result:
          $ref: '#/components/schemas/ImageInfo'
          description: Результат.
      required:
      - applied
    ImageInfo:
      type: object
      properties:
        width:
          type: integer
          description: Ширина, px.
        height:
          type: integer
          description: Высота, px.
        size:
          type: integer
          description: Размер, байт.
        mime:
          type: string
          description: MIME-тип.
      required:
      - width
      - height
      - size
      - mime
    Upload:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор загрузки (UUID). Пустая строка, если файл создан сразу по `sha256`.
        name:
          type: string
          description: Имя будущего файла.
        size:
          type: integer
          description: Объявленный размер, байт.
        offset:
          type: integer
          description: Сколько байт уже получено.
        chunkSize:
          type: integer
          description: Рекомендуемый размер части, байт (8 МиБ). `0` — передавать ничего не нужно.
        expiresAt:
          type: string
          description: Когда загрузка удалится, если её не завершить (через 24 часа). Пустая строка — при дедупликации.
        file:
          oneOf:
          - $ref: '#/components/schemas/File'
          - type: 'null'
          description: Готовый файл, если он создан сразу по `sha256`; иначе `null`.
      required:
      - id
      - name
      - size
      - offset
      - chunkSize
      - expiresAt
      - file
    Folder:
      type: object
      properties:
        name:
          type: string
          description: Имя папки.
        public:
          type: boolean
          description: Файлы папки открываются без токена по `/o/…`.
        retention:
          $ref: '#/components/schemas/Named'
          description: 'Срок хранения: `{ "id": 3, "name": "MONTH" }`.'
        cache:
          type: object
          properties:
            maxAge:
              type:
              - integer
              - 'null'
              description: '`max-age`, секунд; `null` — как у бакета.'
            visibility:
              oneOf:
              - $ref: '#/components/schemas/Named'
              - type: 'null'
              description: Кто кэширует; `null` — как у бакета.
          description: Своя политика кэша.
        createdAt:
          type: string
          format: date-time
          description: Когда создана.
        updatedAt:
          type: string
          format: date-time
          description: Когда изменена.
      required:
      - name
      - public
      - retention
      - cache
      - createdAt
      - updatedAt
    Link:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: Идентификатор учитываемой ссылки; `null` у подписанной.
        url:
          type: string
          description: Адрес ссылки `/t/…`.
        expiresAt:
          type: string
          format: date-time
          description: Когда истекает.
        revocable:
          type: boolean
          description: Можно ли отозвать по одной.
        maxDownloads:
          type:
          - integer
          - 'null'
          description: Лимит скачиваний; `null` — без лимита.
        downloads:
          type: integer
          description: Сколько раз скачали.
        revoked:
          type: boolean
          description: Отозвана ли.
        disposition:
          $ref: '#/components/schemas/Named'
          description: 'Открыть или скачать: `{ "id": 1, "name": "ATTACHMENT" }`.'
        note:
          type: string
          description: Заметка.
      required:
      - id
      - url
      - expiresAt
      - revocable
      - maxDownloads
      - downloads
      - revoked
      - disposition
      - note
    Epoch:
      type: object
      properties:
        epoch:
          type: integer
          description: 'Номер новой «эпохи» подписи: все ссылки, выданные раньше, недействительны.'
      required:
      - epoch
    Retention:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      description: |
        Срок хранения файлов папки, считая от загрузки.

        - `0` — NONE — бессрочно
        - `1` — DAY — сутки
        - `2` — WEEK — неделя
        - `3` — MONTH — месяц
        - `4` — QUARTER — квартал
        - `5` — HALF_YEAR — полгода
        - `6` — YEAR — год
      x-enum-varnames:
      - NONE
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - HALF_YEAR
      - YEAR
    CacheVisibility:
      type: integer
      enum:
      - 1
      - 2
      - 3
      description: |
        Кто может кэшировать ответ.

        - `1` — SHARED — общий кэш: браузер и CDN
        - `2` — PRIVATE — только браузер
        - `3` — NO_STORE — не кэшировать
      x-enum-varnames:
      - SHARED
      - PRIVATE
      - NO_STORE
    Disposition:
      type: integer
      enum:
      - 0
      - 1
      description: |
        Открыть файл в браузере или скачать.

        - `0` — INLINE — открыть в браузере
        - `1` — ATTACHMENT — скачать
      x-enum-varnames:
      - INLINE
      - ATTACHMENT
    ImageFormat:
      type: string
      enum:
      - ORIGINAL
      - WEBP
      - JPEG
      - PNG
      - AVIF
      description: |
        Формат результата обработки картинки.

        - `ORIGINAL` — не менять формат
        - `WEBP`
        - `JPEG`
        - `PNG`
        - `AVIF`
