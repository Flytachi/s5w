  /v1/uploads/{id}:
    get:
      tags:
      - Загрузка частями
      operationId: getUpload
      summary: Узнать, сколько дошло
      description: |
        Состояние загрузки: в `offset` — сколько байт сервер уже получил. После обрыва связи продолжайте с этого места.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор загрузки из `POST /v1/uploads`.
        schema:
          type: string
          format: uuid
        example: 9c10a01c-a293-438c-88ba-b48181b9cd67
      responses:
        '200':
          description: Загрузка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                id: 3bc19c9a-4be5-49c8-8c2c-bc8e261461f5
                name: notes.txt
                size: 99
                offset: 99
                chunkSize: 8388608
                expiresAt: '2026-11-08T21:21:10+00:00'
                file: null
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Загрузки нет или она истекла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Upload does not exist or has expired
    patch:
      tags:
      - Загрузка частями
      operationId: appendChunk
      summary: Отправить часть
      description: |
        Добавляет к загрузке очередную часть. **Тело — сырые байты части**, не JSON и не форма.
        Повторяйте, пока `offset` в ответе не станет равен `size`.

        Часть — от 4 до 16 МиБ; меньше можно только последнюю. Передавайте `Upload-Offset`: если часть
        потерялась или ушла дважды, сервер ответит `409` вместо испорченного файла.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор загрузки из `POST /v1/uploads`.
        schema:
          type: string
          format: uuid
        example: 9c10a01c-a293-438c-88ba-b48181b9cd67
      - name: Upload-Offset
        in: header
        required: false
        description: С какого байта начинается часть. Необязателен, но лучше передавать.
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        description: Байты части, 4–16 МиБ (последняя — любого размера).
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Часть принята, в `offset` — новая позиция.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                id: 3bc19c9a-4be5-49c8-8c2c-bc8e261461f5
                name: notes.txt
                size: 99
                offset: 99
                chunkSize: 8388608
                expiresAt: '2026-11-08T21:21:10+00:00'
                file: null
        '400':
          description: Часть пустая или меньше 4 МиБ и не последняя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: 'Chunk is too small: 10 bytes, the minimum is 4194304'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Загрузки нет или она истекла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`Upload-Offset` не совпал с тем, что уже получено.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 409
                message: Chunk offset 4096 does not continue this upload at 0
        '413':
          description: Часть больше 16 МиБ или выходит за объявленный `size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
