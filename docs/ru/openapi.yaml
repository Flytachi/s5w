        required: false
        description: Диапазон байтов, например `bytes=0-1023` — ответ `206`.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: '`ETag`, полученный раньше: если файл не менялся — `304` без тела.'
        schema:
          type: string
      responses:
        '200':
          description: 'Содержимое файла. Заголовки: `Content-Type`, `Content-Length`, `ETag`, `Cache-Control`,
            `Content-Disposition`, `Accept-Ranges`.'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: Запрошенный диапазон байтов; заголовок `Content-Range`.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: Файл не менялся с этого `ETag` — тела нет.
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
