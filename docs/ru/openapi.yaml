openapi: 3.1.0
info:
  title: S5W — клиентский API
  version: '1.1'
  summary: Загрузка, хранение и раздача файлов
  description: |
    Всё, что нужно приложению от S5W: положить файл, получить на него ссылку, раздать.

    **Бакет определяется токеном.** Его нет ни в одном адресе API: токен выдан одному бакету и
    работает только в нём.

    **Уровни токена:** `BASIC` («только отдача» в панели) — `GET /v1/check` и скачивание
    `/p/{id}`; `FULL` («полный доступ») — всё.

    **Форматы.** Списки отвечают `{ "meta": {…}, "data": [ … ] }`. Ошибки — `{ "code", "message" }`,
    при ошибке проверки параметров ещё `errors` по полям. Перечисления в запросах передаются
    числом (`"retention": 3`), кроме строкового `format`; в ответах — объектом
    `{ "id": 3, "name": "MONTH" }`. Удаление отвечает `204` без тела.

    **Время** — RFC 3339 (ISO 8601) с часовым поясом: `2026-11-08T17:10:44+00:00`. Во всех
    ответах одинаково; стандартные библиотеки разбирают его без подготовки.

    Полная документация: https://winterframe.net/ru/apps/s5w/overview

    | Код | Когда |
    |---|---|
    | `200` / `201` | успех / создано |
    | `204` | удалено, тела нет |
    | `400` | файл не передан; пустая или слишком маленькая часть загрузки |
    | `401` | нет токена или он неизвестен |
    | `403` | токен отключён, истёк или его уровня мало |
    | `404` | нет такого файла, загрузки, ссылки или папки (в `/v1/folders/{name}`) |
    | `409` | конфликт: имя занято, смещение части не совпало, загрузка не закончена |
    | `413` | не хватает квоты, тело больше 32 МиБ, часть больше 16 МиБ |
    | `422` | параметры не прошли проверку, нет указанной папки, хеш не совпал, картинку нельзя обработать |
    | `507` | на сервере кончается место |
servers:
- url: '{baseUrl}'
  description: Ваш сервер S5W
  variables:
    baseUrl:
      default: http://localhost:9090
      description: Адрес API со схемой и без / в конце — например, https://s5.example.com
security:
- token: []
tags:
- name: Проверка токена
  description: Первый запрос — убедиться, что адрес и токен указаны верно.
- name: Папки
  description: |
    Необязательная группировка файлов. Папка задаёт файлам общие правила — видимость, срок
    хранения и кэш. **Корень бакета всегда публичный**: закрытые файлы держите в папке с
    `public: false`.
- name: Файлы
  description: Загрузка одним запросом (до 32 МиБ) и управление файлами бакета.
- name: Загрузка частями
  description: |
    Для больших файлов и ненадёжной сети: файл уходит частями по 4–16 МиБ, после обрыва
    загрузка продолжается с полученного места. Порядок: начать → отправлять части → завершить.
- name: Временные ссылки
  description: |
    Ссылка `/t/…` на один файл: открывается без токена, но только до срока и, если нужно,
    ограниченное число раз. Работает и для закрытых файлов.
- name: Раздача
  description: |
    Как файл получает браузер, приложение или CDN: публично (`/o`), по токену (`/p`) и по
    временной ссылке (`/t`). Все три поддерживают `Range`, `ETag` и условные запросы.
paths:
  /v1/check:
    get:
      tags:
      - Проверка токена
      operationId: checkToken
      summary: Проверить токен
      description: |
        Проверяет токен и показывает, к какому бакету он относится, какой у него уровень доступа и
        сколько осталось места.

        Используйте первым запросом — чтобы убедиться, что адрес и токен указаны верно. В приложении —
        например, при старте, чтобы сразу увидеть отозванный токен.

        **Токен:** `BASIC`.
      x-token-level: BASIC
      responses:
        '200':
          description: Токен принят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
              example:
                bucket:
                  id: 26cf7ca6-fa2b-410a-887f-1ed75396531d
                  name: postman
                access:
                  id: 2
                  name: FULL
                expiresAt: null
                bytes:
                  quota: 104857600
                  used: 0
                  free: 104857600
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                check:
                  summary: неизвестный токен
                  value:
                    code: 401
                    message: Access token is invalid
        '403':
          description: Токен отключён, истёк или его уровня не хватает.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders:
    post:
      tags:
      - Папки
      operationId: createFolder
      summary: Создать папку
      description: |
        Создаёт папку в бакете. Вложенных папок нет.

        Срок хранения считается от загрузки файла; истёкшие файлы удаляются сами, раз в 5 минут.

        **Токен:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[\p{L}\p{N}][\p{L}\p{N} ._-]*$
                  description: Буквы, цифры, пробел, `.`, `_`, `-`; начинается с буквы или цифры.
                public:
                  type: boolean
                  default: false
                  description: '`true` — файлы папки открываются по `/o/…` без токена.'
                retention:
                  $ref: '#/components/schemas/Retention'
                  default: 0
                  description: Срок хранения файлов.
              required:
              - name
      responses:
        '201':
          description: Папка создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794086470130
                public: false
                retention:
                  id: 3
                  name: MONTH
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T21:21:10+00:00'
                updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Такая папка уже есть.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 409
                message: Folder "capture-dup" already exists
        '422':
          description: Имя не подходит.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                folder-create:
                  summary: неверное имя
                  value:
                    code: 422
                    message: Validation failed
                    errors:
                      name:
                      - may contain letters, digits, space, dot, underscore, dash
                err-422:
                  summary: параметры не прошли проверку
                  value:
                    code: 422
                    message: Validation failed
                    errors:
                      name:
                      - may contain letters, digits, space, dot, underscore, dash
                      retention:
                      - retention must be one of [0, 1, 2, 3, 4, 5, 6], got '99'
    get:
      tags:
      - Папки
      operationId: listFolders
      summary: Список папок
      description: |
        Возвращает папки бакета постранично.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы, с 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Сколько записей на странице.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: search
        in: query
        required: false
        description: Поиск по имени.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Страница папок.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
              example:
                meta:
                  current: 1
                  size: 25
                  total: 1
                  pages: 1
                  previous: null
                  next: null
                data:
                - name: demo-1794086470130
                  public: false
                  retention:
                    id: 3
                    name: MONTH
                  cache:
                    maxAge: null
                    visibility: null
                  createdAt: '2026-11-07T21:21:10+00:00'
                  updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders/{name}:
    get:
      tags:
      - Папки
      operationId: getFolder
      summary: Получить папку
      description: |
        Возвращает одну папку по имени.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Имя папки.
        schema:
          type: string
        example: documents
      responses:
        '200':
          description: Папка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794086470130
                public: false
                retention:
                  id: 3
                  name: MONTH
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T21:21:10+00:00'
                updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Нет такой папки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Folder "nope" does not exist
    put:
      tags:
      - Папки
      operationId: updateFolder
      summary: Изменить папку
      description: |
        Меняет имя, видимость и срок хранения. Тело — как при создании, все поля задаются заново.

        Изменения сразу касаются файлов, которые уже лежат в папке:

        - **видимость** меняется у всех файлов: закрыли папку — их `/o/…` перестаёт работать;
        - **срок хранения** пересчитывается у всех файлов **от даты их загрузки**. Если сократить срок,
          файлы старше нового срока удалятся при ближайшей очистке — в течение 5 минут.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Имя папки.
        schema:
          type: string
        example: documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[\p{L}\p{N}][\p{L}\p{N} ._-]*$
                  description: Буквы, цифры, пробел, `.`, `_`, `-`; начинается с буквы или цифры.
                public:
                  type: boolean
                  default: false
                  description: '`true` — файлы папки открываются по `/o/…` без токена.'
                retention:
                  $ref: '#/components/schemas/Retention'
                  default: 0
                  description: Срок хранения файлов.
              required:
              - name
      responses:
        '200':
          description: Папка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794086470130
                public: false
                retention:
                  id: 2
                  name: WEEK
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T21:21:10+00:00'
                updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Нет такой папки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Новое имя занято.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Параметры не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Папки
      operationId: deleteFolder
      summary: Удалить папку
      description: |
        Удаляет папку **вместе со всеми файлами в ней**. Отменить нельзя.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Имя папки.
        schema:
          type: string
        example: documents
      responses:
        '204':
          description: Удалено, тела нет.
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Нет такой папки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders/{name}/cache:
    patch:
      tags:
      - Папки
      operationId: setFolderCache
      summary: Задать папке политику кэша
      description: |
        Задаёт заголовок `Cache-Control` для файлов папки — вместо политики бакета. `null` в поле —
        наследовать от бакета.

        Для закрытых файлов и каналов `/p`, `/t` видимость всегда не выше `PRIVATE`, а `max-age` не
        дольше оставшегося срока файла или ссылки.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Имя папки.
        schema:
          type: string
        example: documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxAge:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 31536000
                  description: Сколько секунд кэшировать.
                visibility:
                  oneOf:
                  - $ref: '#/components/schemas/CacheVisibility'
                  - type: 'null'
                  description: Кто кэширует.
      responses:
        '200':
          description: Папка с новым `cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794086470130
                public: false
                retention:
                  id: 2
                  name: WEEK
                cache:
                  maxAge: 604800
                  visibility:
                    id: 1
                    name: SHARED
                createdAt: '2026-11-07T21:21:10+00:00'
                updatedAt: '2026-11-07T21:21:10+00:00'
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Нет такой папки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/files:
    post:
      tags:
      - Файлы
      operationId: uploadFile
      summary: Загрузить файл
      description: |
        Загружает файл одним запросом `multipart/form-data` и сразу возвращает его адреса. Предел —
        **32 МиБ** на весь запрос; файлы больше — через загрузку частями.

        **Имя** уникально в пределах папки: если занято, добавляется номер — `photo (1).png`. `/`, `\`
        и управляющие символы заменяются на `-`.

        **Дедупликация.** Если такое содержимое в бакете уже есть, место на диске и квота не
        расходуются, в ответе `deduplicated: true`.

        **Обработка картинки.** С полями `format`, `maxWidth`, `maxHeight`, `quality` картинка
        уменьшается, поворачивается по EXIF и перекодируется до сохранения; хранится результат.
        Картинка только уменьшается, анимация не трогается. При смене формата меняется и расширение:
        `photo.png` → `photo.webp`.

        **Токен:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Сам файл.
                folder:
                  type: string
                  maxLength: 100
                  description: Имя папки. Без него — корень бакета, и файл будет публичным.
                name:
                  type: string
                  maxLength: 255
                  description: Имя файла. Без него — имя загруженного файла.
                format:
                  $ref: '#/components/schemas/ImageFormat'
                  description: Формат результата; `ORIGINAL` — не менять.
                maxWidth:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Уменьшить до этой ширины, пропорции сохраняются.
                maxHeight:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Уменьшить до этой высоты, пропорции сохраняются.
                quality:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 'Качество; без него — по формату: AVIF 55, PNG 60, WEBP и JPEG 82.'
              required:
              - file
      responses:
        '201':
          description: Файл загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              examples:
                upload:
                  summary: успех
                  value:
                    id: -ps4-0KkCpjsadLA
                    name: photo.png
                    folder: null
                    content:
                      size: 4654
                      mime: image/png
                      extension: png
                      hash: ee300dd3885906657a97edefa78057610a91570d6e594a764fab92c6db518572
                    public: true
                    deduplicated: false
                    processed:
                      applied: false
                      reason: no options
                    expiresAt: null
                    privateUrl: https://s5.example.com/p/-ps4-0KkCpjsadLA
                    publicUrl: https://s5.example.com/o/26cf7ca6-fa2b-410a-887f-1ed75396531d/-ps4-0KkCpjsadLA
                    createdAt: '2026-11-07T21:21:10+00:00'
                    updatedAt: '2026-11-07T21:21:10+00:00'
                upload-image:
                  summary: успех
                  value:
                    id: wpn4AiYxv22Tks-u
                    name: photo.webp
                    folder: null
                    content:
                      size: 2250
                      mime: image/webp
                      extension: webp
                      hash: 250c33b15669b8b0ceda27d301f46414e4e399ec9f85d9b5f9d34eeddb104381
                    public: true
                    deduplicated: false
                    processed:
                      applied: true
                      operations:
                      - resize:800x533
                      - encode:webp@82
                      source:
                        width: 1200
                        height: 800
                        size: 4654
                        mime: image/png
                      result:
                        width: 800
                        height: 533
                        size: 2250
                        mime: image/webp
                    expiresAt: null
                    privateUrl: https://s5.example.com/p/wpn4AiYxv22Tks-u
                    publicUrl: https://s5.example.com/o/26cf7ca6-fa2b-410a-887f-1ed75396531d/wpn4AiYxv22Tks-u
                    createdAt: '2026-11-07T21:21:10+00:00'
                    updatedAt: '2026-11-07T21:21:10+00:00'
        '400':
          description: Файл не передан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Uploaded file 'file' is missing
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Токен отключён, истёк или его уровня не хватает.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Не хватает квоты бакета или запрос больше 32 МиБ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Нет указанной папки, параметры не прошли проверку или картинку нельзя обработать.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upload:
                  summary: нет такой папки
                  value:
                    code: 422
                    message: Folder "nope" does not exist
                upload-image:
                  summary: опции заданы, а файл не картинка
                  value:
                    code: 422
                    message: Image options were given, but this file is not an image
    get:
      tags:
      - Файлы
      operationId: listFiles
      summary: Список файлов
      description: |
        Возвращает файлы бакета постранично, с поиском и сортировкой.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы, с 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
