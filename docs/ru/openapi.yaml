        '404':
          description: Нет такого файла в бакете токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/links:
    get:
      tags:
      - Временные ссылки
      operationId: listLinks
      summary: Все ссылки бакета
      description: |
        Учитываемые ссылки всего бакета постранично, новые первыми — включая истёкшие и отозванные, пока их не удалит ночная очистка.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
