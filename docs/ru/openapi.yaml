  /o/{bucketId}/{id}:
    get:
      tags:
      - Раздача
      operationId: getPublic
      summary: Скачать публичный файл
      description: |
        Отдаёт публичный файл **без токена** — адрес из `publicUrl`. Его можно ставить в `<img src>`,
        отдавать пользователям и CDN. Работает только для публичных файлов — в корне бакета или в
        папке с `public: true`; для остальных — `404`.

        Картинки, видео, аудио, PDF и простой текст открываются в браузере, остальное — скачивается;
        HTML и SVG всегда скачиваются. `?download=1` просит скачать в любом случае.
      security: []
      parameters:
      - name: bucketId
        in: path
        required: true
        description: Идентификатор бакета.
        schema:
          type: string
          format: uuid
        example: 7e8738ca-ab73-498b-9925-db9169f962f0
      - name: id
        in: path
        required: true
        description: Идентификатор файла из поля `id`, 16 символов.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      - name: download
        in: query
        required: false
        description: '`1` — скачать (`Content-Disposition: attachment`), а не открыть.'
        schema:
          type: string
          enum: &id001
          - '1'
      - name: Range
        in: header
        required: false
        description: Диапазон байтов, например `bytes=0-1023` — ответ `206`.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: '`ETag`, полученный раньше: если файл не менялся — `304` без тела.'
        schema:
          type: string
      responses:
        '200':
          description: 'Содержимое файла. Заголовки: `Content-Type`, `Content-Length`, `ETag`, `Cache-Control`,
            `Content-Disposition`, `Accept-Ranges`.'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: Запрошенный диапазон байтов; заголовок `Content-Range`.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: Файл не менялся с этого `ETag` — тела нет.
        '404':
          description: Файл не публичный или его нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: File not found
  /p/{id}:
