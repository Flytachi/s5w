        description: Идентификатор файла из поля `id`, 16 символов.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      responses:
        '200':
          description: Массив ссылок.
          content:
            application/json:
              schema:
                type: array
