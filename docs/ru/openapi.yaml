    put:
      tags:
      - Файлы
      operationId: placeFile
      summary: Переименовать или перенести файл
      description: |
        Меняет имя файла и папку, где он лежит. Содержимое и `id` не меняются.

        `folder` описывает, **где файл будет после запроса**. Чтобы только переименовать файл в папке —
        передайте её имя, иначе файл переедет в корень.

        При переносе файл получает правила новой папки — её видимость и срок хранения; срок считается
        от момента переноса. **Перенос в корень делает файл публичным**: он станет доступен по `/o/…`
        без токена.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор файла из поля `id`, 16 символов.
        schema:
          type: string
          minLength: 16
          maxLength: 16
