  /v1/files/{id}/link:
    post:
      tags:
      - Временные ссылки
      operationId: issueLink
      summary: Выдать временную ссылку
      description: |
        Выдаёт подписанную ссылку `/t/…` на файл. Она открывается без токена, но только до срока.

        **Два вида.** Без `maxDownloads` и `revocable` ссылка **подписанная**: в базе не хранится,
        `id: null`, отозвать по одной нельзя — только все ссылки бакета разом. С любым из этих полей —
        **учитываемая**: хранится, считает скачивания, отзывается по одной.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор файла из поля `id`, 16 символов.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  type: integer
                  minimum: 1
                  maximum: 2592000
                  default: 3600
                  description: 'Срок жизни, секунд: до 30 дней.'
                disposition:
                  $ref: '#/components/schemas/Disposition'
                  default: 0
                  description: Открыть в браузере или скачать.
                maxDownloads:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Лимит скачиваний. Делает ссылку учитываемой.
                revocable:
                  type: boolean
                  default: false
                  description: Можно отозвать по одной. Делает ссылку учитываемой.
                note:
                  type: string
                  maxLength: 255
                  description: Заметка для себя.
              required:
              - ttl
      responses:
        '201':
          description: Ссылка выдана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
              examples:
                link-issue:
                  summary: успех
                  value:
                    id: null
                    url: https://s5.example.com/t/AQAAAAAAAAADau-kVgAAAAABzw4AyX-bHblFCyuA82mNpw
                    expiresAt: '2026-11-07T22:21:10+00:00'
                    revocable: false
                    maxDownloads: null
                    downloads: 0
                    revoked: false
                    disposition:
                      id: 0
                      name: INLINE
                    note: ''
                link-counted:
                  summary: успех
                  value:
                    id: 1
                    url: https://s5.example.com/t/AQAAAAAAAAADavDnxgMAAAABAAAAAAAAAAE03U_0Q532vTqsB62CC3c9
                    expiresAt: '2026-11-08T21:21:10+00:00'
                    revocable: true
                    maxDownloads: 3
                    downloads: 0
                    revoked: false
                    disposition:
                      id: 1
                      name: ATTACHMENT
                    note: для подрядчика
        '401':
          description: Токена нет или он неизвестен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Нет такого файла в бакете токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Параметры не прошли проверку — например, `ttl` больше 30 дней.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 422
                message: Validation failed
                errors:
                  ttl:
                  - must not exceed 2592000
  /v1/files/{id}/links:
    get:
      tags:
      - Временные ссылки
      operationId: fileLinks
      summary: Ссылки одного файла
      description: |
        Последние 20 учитываемых ссылок файла, новые первыми — с числом скачиваний, сроком и признаком отзыва; истёкшие и отозванные тоже, пока их не удалит ночная очистка. Подписанных здесь нет — они нигде не хранятся.

        **Токен:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
