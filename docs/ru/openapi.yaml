  /v1/uploads:
    post:
      tags:
      - Загрузка частями
      operationId: startUpload
      summary: Начать загрузку
      description: |
        Открывает загрузку: сервер заранее проверяет квоту и место на диске и возвращает `id`
        загрузки и рекомендуемый размер части `chunkSize`. Загрузка ждёт продолжения 24 часа.

        **Дедупликация по `sha256`.** Если такое содержимое в бакете уже есть, файл создаётся сразу:
        в ответе `chunkSize: 0` и готовый `file` с `deduplicated: true` — отправлять части и завершать
        не нужно. С опциями обработки картинки поиск по хешу не выполняется: хеш считается от
        исходника, а хранится результат.

        **Токен:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Имя будущего файла.
                size:
                  type: integer
                  minimum: 1
                  description: Размер файла, байт.
                sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: 'Хеш содержимого, 64 hex-символа: проверка целостности при завершении и дедупликация.'
                folder:
                  type: string
                  maxLength: 100
                  description: 'Имя папки. Проверяется сразу: если её нет — `422`.'
                format:
                  $ref: '#/components/schemas/ImageFormat'
                  description: Формат результата; `ORIGINAL` — не менять.
                maxWidth:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Уменьшить до этой ширины, пропорции сохраняются.
                maxHeight:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Уменьшить до этой высоты, пропорции сохраняются.
                quality:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 'Качество; без него — по формату: AVIF 55, PNG 60, WEBP и JPEG 82.'
              required:
              - name
              - size
      responses:
        '201':
          description: Загрузка открыта — или файл создан сразу по `sha256`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                up-start:
                  summary: успех
                  value:
                    id: 3bc19c9a-4be5-49c8-8c2c-bc8e261461f5
                    name: notes.txt
                    size: 99
                    offset: 0
                    chunkSize: 8388608
                    expiresAt: '2026-11-08T21:21:10+00:00'
                    file: null
                up-dedup:
                  summary: успех
                  value:
                    id: ''
                    name: notes-copy.txt
                    size: 99
                    offset: 99
                    chunkSize: 0
                    expiresAt: ''
                    file:
                      id: Dyh-JjigglJ8whPY
                      name: notes-copy.txt
                      folder: null
                      content:
                        size: 99
                        mime: text/plain
                        extension: txt
                        hash: 81e2bc55904154f76a08b9e7564031bf73c6015f8253fad9a51efa42e3eaabc4
                      public: true
                      deduplicated: true
                      processed: null
                      expiresAt: null
                      privateUrl: https://s5.example.com/p/Dyh-JjigglJ8whPY
                      publicUrl: https://s5.example.com/o/26cf7ca6-fa2b-410a-887f-1ed75396531d/Dyh-JjigglJ8whPY
                      createdAt: '2026-11-07T21:21:10+00:00'
