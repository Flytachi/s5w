                    url: https://s5.example.com/t/AQAAAAAAAAALau-0sQAAAAADGcZfqEMAcFy4RevV_H5Vlw
                    expiresAt: '2026-11-07T23:30:57+00:00'
                    revocable: false
                    maxDownloads: null
                    downloads: 0
                    revoked: false
                    disposition:
                      id: 0
                      name: INLINE
                    note: ''
                link-counted:
                  summary: success
                  value:
                    id: 3
                    url: https://s5.example.com/t/AQAAAAAAAAALavD4IQMAAAADAAAAAAAAAANNMm_jgUcKZtGosvmbCaJr
                    expiresAt: '2026-11-08T22:30:57+00:00'
