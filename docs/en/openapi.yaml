                type: array
                items:
                  $ref: '#/components/schemas/Link'
              example:
              - id: 3
                url: https://s5.example.com/t/AQAAAAAAAAALavD4IQMAAAADAAAAAAAAAANNMm_jgUcKZtGosvmbCaJr
                expiresAt: '2026-11-08T22:30:57+00:00'
                revocable: true
                maxDownloads: 3
                downloads: 0
                revoked: false
                disposition:
                  id: 1
                  name: ATTACHMENT
                note: for the contractor
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such file in the bucket of the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/links:
    get:
      tags:
      - Temporary links
      operationId: listLinks
      summary: All links of the bucket
      description: |
        Tracked links of the whole bucket page by page, newest first — expired, revoked and used-up ones included: a link is kept until 7 days after its `expiresAt`.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
        in: query
        required: false
        description: Page number, from 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Records per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
              example:
                meta:
                  current: 1
                  size: 25
                  total: 1
                  pages: 1
                  previous: null
                  next: null
                data:
                - id: 3
                  url: https://s5.example.com/t/AQAAAAAAAAALavD4IQMAAAADAAAAAAAAAANNMm_jgUcKZtGosvmbCaJr
                  expiresAt: '2026-11-08T22:30:57+00:00'
                  revocable: true
                  maxDownloads: 3
                  downloads: 0
                  revoked: false
                  disposition:
                    id: 1
                    name: ATTACHMENT
                  note: for the contractor
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Temporary links
      operationId: revokeAllLinks
      summary: Revoke every link of the bucket
      description: |
        Revokes **every** temporary link of the bucket, signed ones included. New links are issued as usual afterwards. For a leaked link that cannot be revoked on its own.

        **Token:** `FULL`.
      x-token-level: FULL
      responses:
        '200':
          description: Number of the new signing epoch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Epoch'
              example:
                epoch: 4
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/links/{id}:
    delete:
      tags:
      - Temporary links
      operationId: revokeLink
      summary: Revoke a link
      description: |
        Revokes one tracked link. It stops opening at once.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: '`id` of a tracked link.'
        schema:
          type: integer
          minimum: 1
        example: 17
      responses:
        '204':
          description: Revoked, no body.
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Share link does not exist
  /o/{bucketId}/{id}:
    get:
      tags:
      - Delivery
      operationId: getPublic
      summary: Download a public file
      description: |
        Serves a public file **without a token** — the address from `publicUrl`. Put it into
        `<img src>`, hand it to users and to a CDN. Works only for public files — in the bucket root or
        in a folder with `public: true`; others answer `404`.

        Images, video, audio, PDF and plain text open in the browser, everything else downloads; HTML
        and SVG always download. `?download=1` asks for a download in any case.
      security: []
      parameters:
      - name: bucketId
        in: path
        required: true
        description: Bucket id.
        schema:
          type: string
          format: uuid
        example: 7e8738ca-ab73-498b-9925-db9169f962f0
      - name: id
        in: path
        required: true
        description: File id from the `id` field, 16 characters.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      - name: download
        in: query
        required: false
        description: '`1` — download (`Content-Disposition: attachment`) instead of opening.'
        schema:
          type: string
          enum: &id001
          - '1'
      - name: Range
        in: header
        required: false
        description: A byte range, e.g. `bytes=0-1023` — answers `206`; outside the file — `416`. Ignored on a temporary
          link with a download limit.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: 'An `ETag` received before: when the file has not changed — `304` with no body.'
        schema:
          type: string
      responses:
        '200':
          description: 'The file content. Headers: `Content-Type`, `Content-Length`, `ETag`, `Cache-Control`, `Content-Disposition`,
            `Accept-Ranges`.'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range; `Content-Range` header.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed since that `ETag` — no body.
        '404':
          description: The file is not public or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: File not found
        '416':
          description: The `Range` is outside the file.
  /p/{id}:
    get:
      tags:
      - Delivery
      operationId: getPrivate
      summary: Download with a token
      description: |
        Serves **any** file of the bucket — public or private — with a token; the address from
        `privateUrl`. A `BASIC` token is enough: such a token can ship inside a client app — it cannot
        list files, only fetch those whose `id` it knows. The answer is cached by the browser only
        (`private`), and by default with `max-age=0`: the browser asks every time, and `ETag` keeps that cheap.

        **Token:** `BASIC`.
      x-token-level: BASIC
      parameters:
      - name: id
        in: path
        required: true
        description: File id from the `id` field, 16 characters.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      - name: download
        in: query
        required: false
        description: '`1` — download (`Content-Disposition: attachment`) instead of opening.'
        schema:
          type: string
          enum: *id001
      - name: Range
        in: header
        required: false
        description: A byte range, e.g. `bytes=0-1023` — answers `206`; outside the file — `416`. Ignored on a temporary
          link with a download limit.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: 'An `ETag` received before: when the file has not changed — `304` with no body.'
        schema:
          type: string
      responses:
        '200':
          description: 'The file content. Headers: `Content-Type`, `Content-Length`, `ETag`, `Cache-Control`, `Content-Disposition`,
            `Accept-Ranges`.'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range; `Content-Range` header.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed since that `ETag` — no body.
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Access token required
        '404':
          description: No such file in the bucket of the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '416':
          description: The `Range` is outside the file.
  /t/{token}:
    get:
      tags:
      - Delivery
      operationId: getTemporary
      summary: Open a temporary link
      description: 'Serves the file through a temporary link, without a token. After expiry, revocation or the download
        limit — `404`. It downloads when issued with `disposition: 1` or when the type may not be shown in a browser
        (the same rules as `/o`). A link with `maxDownloads` does not support `Range`: the file is served whole,
        `200`.'
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: The signed part of the link after `/t/`.
        schema:
          type: string
          minLength: 40
          maxLength: 128
      - name: Range
        in: header
        required: false
        description: A byte range, e.g. `bytes=0-1023` — answers `206`; outside the file — `416`. Ignored on a temporary
          link with a download limit.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: 'An `ETag` received before: when the file has not changed — `304` with no body.'
        schema:
          type: string
      responses:
        '200':
          description: 'The file content. Headers: `Content-Type`, `Content-Length`, `ETag`, `Cache-Control`, `Content-Disposition`,
            `Accept-Ranges`.'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range; `Content-Range` header.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed since that `ETag` — no body.
        '404':
          description: The link expired, was revoked or is used up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Link is invalid or has expired
        '416':
          description: The `Range` is outside the file.
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A bucket token from the admin panel, `s5w_…`. `BASIC` opens `GET /v1/check` and `/p/{id}`; `FULL`
        — everything.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
        message:
          type: string
          description: What went wrong — in English, for the log and the developer.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Only when validation failed: messages per field.'
      required:
      - code
      - message
    PageMeta:
      type: object
      properties:
        current:
          type: integer
          description: Current page.
        size:
          type: integer
          description: Page size.
        total:
          type: integer
          description: Total records.
        pages:
          type: integer
          description: Total pages.
        previous:
          type:
          - integer
          - 'null'
          description: Previous page or `null`.
        next:
          type:
          - integer
          - 'null'
          description: Next page or `null`.
      required:
      - current
      - size
      - total
      - pages
      - previous
      - next
    Named:
      type: object
      properties:
        id:
          type: integer
          description: Value.
        name:
          type: string
          description: Name of the value.
      required:
      - id
      - name
    Check:
      type: object
      properties:
        bucket:
          type: object
          properties:
            id:
              type: string
              description: Bucket id.
            name:
              type: string
              description: Bucket name.
          description: The bucket the token was issued for.
        access:
          $ref: '#/components/schemas/Named'
          description: 'Token level: `1` BASIC, `2` FULL.'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token expires; `null` — never.
        bytes:
          type: object
          properties:
            quota:
              type: integer
              description: Quota.
            used:
              type: integer
              description: Used.
            free:
              type: integer
              description: Free.
          description: Space in the bucket, in bytes.
      required:
      - bucket
      - access
      - expiresAt
      - bytes
    File:
      type: object
      properties:
        id:
          type: string
          description: File id, 16 characters. Needed by every other request.
        name:
          type: string
          description: File name.
        folder:
          type:
          - string
          - 'null'
          description: Folder name; `null` — the bucket root.
        content:
          type: object
          properties:
            size:
              type: integer
              description: Size in bytes.
            mime:
              type: string
              description: MIME type.
            extension:
              type: string
              description: Extension.
            hash:
              type: string
              description: SHA-256 of the content.
          description: Content.
        public:
          type: boolean
          description: Whether it opens without a token at `publicUrl`.
        deduplicated:
          type: boolean
          description: 'Only in an upload response: `true` — this content was already in the bucket, no space was
            spent. Always `false` in other responses.'
        processed:
          oneOf:
          - $ref: '#/components/schemas/ProcessedImage'
          - type: 'null'
          description: 'Only in an upload response — what image processing did; without options it is `{ "applied":
            false, "reason": "no options" }`. Always `null` in other responses (and on `sha256` deduplication).'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When retention deletes it; `null` — never.
        privateUrl:
          type: string
          description: Download with a token — `/p/{id}`.
        publicUrl:
          type:
          - string
          - 'null'
          description: Public address `/o/{bucketId}/{id}`; `null` when the file is not public.
        createdAt:
          type: string
          format: date-time
          description: When uploaded.
        updatedAt:
          type: string
          format: date-time
          description: When changed.
      required:
      - id
      - name
      - folder
      - content
      - public
      - deduplicated
      - processed
      - expiresAt
      - privateUrl
      - publicUrl
      - createdAt
      - updatedAt
    ProcessedImage:
      type: object
      properties:
        applied:
          type: boolean
          description: Whether processing happened.
        reason:
          type: string
          description: 'Why not: `no options`, `animated`, `nothing to do`, `output is larger than source`.'
        operations:
          type: array
          items:
            type: string
          description: 'What was done: `resize:800x533`, `exif-rotate`, `encode:webp@82`.'
        source:
          $ref: '#/components/schemas/ImageInfo'
          description: Source image.
        result:
          $ref: '#/components/schemas/ImageInfo'
          description: Result.
      required:
      - applied
    ImageInfo:
      type: object
      properties:
        width:
          type: integer
          description: Width, px.
        height:
          type: integer
          description: Height, px.
        size:
          type: integer
          description: Size, bytes.
        mime:
          type: string
          description: MIME type.
      required:
      - width
      - height
      - size
      - mime
    Upload:
      type: object
      properties:
        id:
          type: string
          description: Upload id (UUID). An empty string when the file was created at once by `sha256`.
        name:
          type: string
          description: Name of the future file.
        size:
          type: integer
          description: Declared size, bytes.
        offset:
          type: integer
          description: How many bytes have arrived.
        chunkSize:
          type: integer
          description: Recommended chunk size, bytes (8 MiB). `0` — nothing needs to be sent.
        expiresAt:
          type: string
          description: 'When the upload expires: 24 hours after the last accepted chunk. The sweeper deletes an
            expired one within an hour. An empty string on deduplication.'
        file:
          oneOf:
          - $ref: '#/components/schemas/File'
          - type: 'null'
          description: The ready file when it was created at once by `sha256`; otherwise `null`.
      required:
      - id
      - name
      - size
      - offset
      - chunkSize
      - expiresAt
      - file
    Folder:
      type: object
      properties:
        name:
          type: string
          description: Folder name.
        public:
          type: boolean
          description: Files of the folder open without a token at `/o/…`.
        retention:
          $ref: '#/components/schemas/Named'
          description: 'Retention: `{ "id": 3, "name": "MONTH" }`.'
        cache:
          type: object
          properties:
            maxAge:
              type:
              - integer
              - 'null'
              description: '`max-age`, seconds; `null` — as the bucket.'
            visibility:
              oneOf:
              - $ref: '#/components/schemas/Named'
              - type: 'null'
              description: Who caches; `null` — as the bucket.
          description: Own cache policy.
        createdAt:
          type: string
          format: date-time
          description: When created.
        updatedAt:
          type: string
          format: date-time
          description: When changed.
      required:
      - name
      - public
      - retention
      - cache
      - createdAt
      - updatedAt
    Link:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: Id of a tracked link; `null` for a signed one.
        url:
          type: string
          description: Link address `/t/…`.
        expiresAt:
          type: string
          format: date-time
          description: When it expires.
        revocable:
          type: boolean
          description: Whether it can be revoked on its own.
        maxDownloads:
          type:
          - integer
          - 'null'
          description: Download limit; `null` — none.
        downloads:
          type: integer
          description: How many times downloaded — counted only with `maxDownloads`; otherwise always `0`.
        revoked:
          type: boolean
          description: Whether revoked.
        disposition:
          $ref: '#/components/schemas/Named'
          description: 'Open or download: `{ "id": 1, "name": "ATTACHMENT" }`.'
        note:
          type: string
          description: Note; always empty for a signed link.
      required:
      - id
      - url
      - expiresAt
      - revocable
      - maxDownloads
      - downloads
      - revoked
      - disposition
      - note
    Epoch:
      type: object
      properties:
        epoch:
          type: integer
          description: 'Number of the new signing "epoch": every link issued before is void.'
      required:
      - epoch
    Retention:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      description: |
        How long the files of the folder live: from the upload, or from the move for a file moved in.

        - `0` — NONE — forever
        - `1` — DAY — a day
        - `2` — WEEK — a week
        - `3` — MONTH — a month
        - `4` — QUARTER — a quarter
        - `5` — HALF_YEAR — half a year
        - `6` — YEAR — a year
      x-enum-varnames:
      - NONE
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - HALF_YEAR
      - YEAR
    CacheVisibility:
      type: integer
      enum:
      - 1
      - 2
      - 3
      description: |
        Who may cache the response.

        - `1` — SHARED — shared cache: browser and CDN
        - `2` — PRIVATE — browser only
        - `3` — NO_STORE — do not cache
      x-enum-varnames:
      - SHARED
      - PRIVATE
      - NO_STORE
    Disposition:
      type: integer
      enum:
      - 0
      - 1
      description: |
        Open the file in the browser or download it.

        - `0` — INLINE — open in the browser if the type allows it (as on `/o`)
        - `1` — ATTACHMENT — download
      x-enum-varnames:
      - INLINE
      - ATTACHMENT
    ImageFormat:
      type: string
      enum:
      - ORIGINAL
      - WEBP
      - JPEG
      - PNG
      - AVIF
      description: |
        Output format of image processing.

        - `ORIGINAL` — keep the format
        - `WEBP`
        - `JPEG`
        - `PNG`
        - `AVIF`
