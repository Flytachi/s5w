  /v1/uploads:
    post:
      tags:
      - Chunked upload
      operationId: startUpload
      summary: Start an upload
      description: |
        Opens an upload: the server checks the quota and the free disk space up front and returns the
        upload `id` and the recommended chunk size `chunkSize`. The upload waits 24 hours after the last
        accepted chunk; every chunk extends the term.

        **Deduplication by `sha256`.** When the bucket already holds this content, the file is created at
        once: the answer has `chunkSize: 0` and a ready `file` with `deduplicated: true` — no chunks and
        no completion are needed. With image options the hash lookup is skipped: the hash is of the
        source, while the processed result is what gets stored.

        **Token:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Name of the future file.
                size:
                  type: integer
                  minimum: 1
                  description: File size, bytes.
                sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: 'Content hash, 64 hex characters: integrity check on completion and deduplication.'
                folder:
                  type: string
                  maxLength: 100
                  description: 'Folder name. Checked at once: `422` when it does not exist.'
                format:
                  $ref: '#/components/schemas/ImageFormat'
                  description: Output format; `ORIGINAL` — keep.
                maxWidth:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Shrink to this width, keeping proportions.
                maxHeight:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Shrink to this height, keeping proportions.
                quality:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 'Quality; without it — by format: AVIF 55, PNG 60, WEBP and JPEG 82.'
              required:
              - name
              - size
      responses:
        '201':
          description: The upload is open — or the file was created at once by `sha256`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                up-start:
                  summary: success
                  value:
                    id: b7336f5b-8896-4e90-96e0-df39f22a115a
                    name: notes.txt
                    size: 66
                    offset: 0
                    chunkSize: 8388608
                    expiresAt: '2026-11-08T22:30:57+00:00'
                    file: null
                up-dedup:
                  summary: success
                  value:
                    id: ''
                    name: notes-copy.txt
                    size: 66
                    offset: 66
                    chunkSize: 0
                    expiresAt: ''
                    file:
                      id: cZtMNnijaQ3Cy1OF
                      name: notes-copy.txt
                      folder: null
                      content:
                        size: 66
                        mime: text/plain
                        extension: txt
                        hash: 2efdc909f33e07505ad104602c9eb3db5de1b54f0562a5c524020c194930599a
                      public: true
                      deduplicated: true
                      processed: null
                      expiresAt: null
                      privateUrl: https://s5.example.com/p/cZtMNnijaQ3Cy1OF
                      publicUrl: https://s5.example.com/o/2faa480a-4f40-4131-b2ce-5cd6ced969a8/cZtMNnijaQ3Cy1OF
                      createdAt: '2026-11-07T22:30:57+00:00'
                      updatedAt: '2026-11-07T22:30:57+00:00'
                up-cancel-start:
