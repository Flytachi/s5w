  /v1/files/{id}/link:
    post:
      tags:
      - Temporary links
      operationId: issueLink
      summary: Issue a temporary link
      description: |
        Issues a signed `/t/…` link to the file. It opens without a token, but only until it expires.

        **Two kinds.** Without `maxDownloads` and `revocable` the link is **signed**: it is not stored,
        `id: null`, cannot be revoked on its own — only all links of the bucket at once — and does not
        keep a `note`. With either field it is **tracked**: stored, revocable on its own, listed. It counts
        downloads only with `maxDownloads` — with `revocable` alone `downloads` stays `0`. A link with
        `maxDownloads` does not support `Range`: the file is served whole only.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: File id from the `id` field, 16 characters.
        schema:
          type: string
          minLength: 16
          maxLength: 16
        example: unJpzOdDouHWFGGm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  type: integer
                  minimum: 1
                  maximum: 2592000
                  default: 3600
                  description: 'Lifetime, seconds: up to 30 days. Without the field — 3600.'
                disposition:
                  $ref: '#/components/schemas/Disposition'
                  default: 0
                  description: Open in the browser (if the type allows it) or download.
                maxDownloads:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Download limit. Makes the link tracked.
                revocable:
                  type: boolean
                  default: false
                  description: Revocable on its own. Makes the link tracked.
                note:
                  type: string
                  maxLength: 255
                  description: A note for yourself; kept only on a tracked link.
      responses:
        '201':
          description: The link is issued.
