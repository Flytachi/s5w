openapi: 3.1.0
info:
  title: S5W — client API
  version: '1.1'
  summary: Upload, store and deliver files
  description: |
    Everything an application needs from S5W: put a file in, get a link to it, deliver it.

    **The bucket is decided by the token.** It is not part of any API address: a token is issued
    for one bucket and works only there.

    **Token levels:** `BASIC` ("delivery only" in the panel) — `GET /v1/check` and downloads from
    `/p/{id}`; `FULL` ("full access") — everything.

    **Formats.** Lists answer `{ "meta": {…}, "data": [ … ] }` — except `GET /v1/files/{id}/links`,
    which answers an array. Errors answer `{ "code", "message" }`, plus per-field `errors` when
    validation failed; the exception is a body over 32 MiB: the server cuts it off before the
    application, answering `413` with no body. Enumerations are sent as numbers in requests
    (`"retention": 3`), except the string `format`; responses carry them as an object
    `{ "id": 3, "name": "MONTH" }`. Deleting answers `204` with an empty body — except
    `DELETE /v1/links`: `200` and `{ "epoch" }`.

    **Time** is RFC 3339 (ISO 8601) with a time zone: `2026-11-08T17:10:44+00:00`. The same in
    every response; standard libraries parse it as is.

    Full documentation: https://winterframe.net/en/apps/s5w/overview

    | Code | When |
    |---|---|
    | `200` / `201` | success / created |
    | `204` | deleted, no body |
    | `400` | no file sent; an empty or too small upload chunk |
    | `401` | no token, or the token is unknown |
    | `403` | the token is disabled, expired, or its level is too low |
    | `404` | no such file, upload, link, or folder (on `/v1/folders/{name}`) |
    | `409` | conflict: the name is taken, the chunk offset does not match, the upload is not finished, the bucket is not active |
    | `413` | over the quota, a body over 32 MiB (no response body), a chunk over 16 MiB |
    | `416` | a `Range` outside the file |
    | `422` | validation failed, the given folder does not exist, the hash does not match, the image cannot be processed |
    | `501` | the server has no image processing or no encoder for the requested format |
    | `507` | the server is running out of disk space |
servers:
- url: '{baseUrl}'
  description: Your S5W server
  variables:
    baseUrl:
      default: http://localhost:9090
      description: API address with the scheme and no trailing / — e.g. https://s5.example.com
security:
- token: []
tags:
- name: Token check
  description: The first request — make sure the address and the token are right.
- name: Folders
  description: |
    Optional grouping of files. A folder gives its files common rules — visibility, retention
    and caching. **The bucket root is always public**: keep private files in a folder with
    `public: false`.
- name: Files
  description: Single-request upload (up to 32 MiB) and managing the files of the bucket.
- name: Chunked upload
  description: |
    For large files and unreliable networks: the file goes in chunks of 4–16 MiB and resumes
    from what arrived after a break. Order: start → send chunks → complete.
- name: Temporary links
  description: |
    A `/t/…` link to one file: opens without a token, but only until it expires and, if needed,
    a limited number of times. Works for private files too.
- name: Delivery
  description: |
    How a browser, an app or a CDN gets the file: publicly (`/o`), with a token (`/p`) and through
    a temporary link (`/t`). All three support `ETag` and conditional requests; `Range` too, except a
    temporary link with a download limit.
paths:
  /v1/check:
    get:
      tags:
      - Token check
      operationId: checkToken
      summary: Check the token
      description: |
        Checks the token and shows which bucket it belongs to, its access level and how much space is
        left.

        Use it as the first request — to make sure the address and the token are right. In an
        application — for example at start-up, to notice a revoked token at once.

        **Token:** `BASIC`.
      x-token-level: BASIC
      responses:
        '200':
          description: The token is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
              example:
                bucket:
                  id: 2faa480a-4f40-4131-b2ce-5cd6ced969a8
                  name: postman
                access:
                  id: 2
                  name: FULL
                expiresAt: null
                bytes:
                  quota: 104857600
                  used: 0
                  free: 104857600
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                check:
                  summary: unknown token
                  value:
                    code: 401
                    message: Access token is invalid
        '403':
          description: The token is disabled, expired, or its level is too low.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders:
    post:
      tags:
      - Folders
      operationId: createFolder
      summary: Create a folder
      description: |
        Creates a folder in the bucket. Folders do not nest.

        Retention counts from the upload of each file (from the move, for a file moved in); expired files
        are deleted by themselves, every 5 minutes.

        **Token:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[\p{L}\p{N}][\p{L}\p{N} ._-]*$
                  description: Letters, digits, space, `.`, `_`, `-`; starts with a letter or a digit.
                public:
                  type: boolean
                  default: false
                  description: '`true` — files of the folder open at `/o/…` without a token.'
                retention:
                  $ref: '#/components/schemas/Retention'
                  default: 0
                  description: Retention of the files.
              required:
              - name
      responses:
        '201':
          description: The folder is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794090657532
                public: false
                retention:
                  id: 3
                  name: MONTH
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T22:30:57+00:00'
                updatedAt: '2026-11-07T22:30:57+00:00'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Such a folder already exists, or the bucket is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 409
                message: Folder "capture-dup" already exists
        '422':
          description: The name does not fit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                folder-create:
                  summary: invalid name
                  value:
                    code: 422
                    message: Validation failed
                    errors:
                      name:
                      - may contain letters, digits, space, dot, underscore, dash
                err-422:
                  summary: validation failed
                  value:
                    code: 422
                    message: Validation failed
                    errors:
                      name:
                      - may contain letters, digits, space, dot, underscore, dash
                      retention:
                      - retention must be one of [0, 1, 2, 3, 4, 5, 6], got '99'
    get:
      tags:
      - Folders
      operationId: listFolders
      summary: List folders
      description: |
        Returns the folders of the bucket page by page.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
        in: query
        required: false
        description: Page number, from 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Records per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: search
        in: query
        required: false
        description: Search by name.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: A page of folders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
              example:
                meta:
                  current: 1
                  size: 25
                  total: 1
                  pages: 1
                  previous: null
                  next: null
                data:
                - name: demo-1794090657532
                  public: false
                  retention:
                    id: 3
                    name: MONTH
                  cache:
                    maxAge: null
                    visibility: null
                  createdAt: '2026-11-07T22:30:57+00:00'
                  updatedAt: '2026-11-07T22:30:57+00:00'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders/{name}:
    get:
      tags:
      - Folders
      operationId: getFolder
      summary: Get a folder
      description: |
        Returns one folder by its name.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Folder name.
        schema:
          type: string
        example: documents
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794090657532
                public: false
                retention:
                  id: 3
                  name: MONTH
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T22:30:57+00:00'
                updatedAt: '2026-11-07T22:30:57+00:00'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Folder "nope" does not exist
    put:
      tags:
      - Folders
      operationId: updateFolder
      summary: Update a folder
      description: |
        Changes the name, visibility and retention. The body is the same as on creation; every field is
        set anew.

        The change applies at once to the files already in the folder:

        - **visibility** changes for every file: close the folder and their `/o/…` stops working;
        - **retention** is recalculated for every file **from its upload date**. Shorten it and the
          files older than the new term are deleted at the next sweep — within 5 minutes.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Folder name.
        schema:
          type: string
        example: documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[\p{L}\p{N}][\p{L}\p{N} ._-]*$
                  description: Letters, digits, space, `.`, `_`, `-`; starts with a letter or a digit.
                public:
                  type: boolean
                  default: false
                  description: '`true` — files of the folder open at `/o/…` without a token.'
                retention:
                  $ref: '#/components/schemas/Retention'
                  default: 0
                  description: Retention of the files.
              required:
              - name
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794090657532
                public: false
                retention:
                  id: 2
                  name: WEEK
                cache:
                  maxAge: null
                  visibility: null
                createdAt: '2026-11-07T22:30:57+00:00'
                updatedAt: '2026-11-07T22:30:57+00:00'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The new name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Folders
      operationId: deleteFolder
      summary: Delete a folder
      description: |
        Deletes the folder **together with every file in it**. Cannot be undone.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Folder name.
        schema:
          type: string
        example: documents
      responses:
        '204':
          description: Deleted, no body.
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/folders/{name}/cache:
    patch:
      tags:
      - Folders
      operationId: setFolderCache
      summary: Set the cache policy of a folder
      description: |
        Sets the `Cache-Control` header for the files of the folder — instead of the bucket policy. This is
        a full replacement: both fields are set anew, and an omitted field becomes `null` too — inherit
        from the bucket.

        For private files and the `/p`, `/t` channels the visibility is never above `PRIVATE`, and
        `max-age` never longer than what is left of the file or the link.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: name
        in: path
        required: true
        description: Folder name.
        schema:
          type: string
        example: documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxAge:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 31536000
                  description: Seconds to cache.
                visibility:
                  oneOf:
                  - $ref: '#/components/schemas/CacheVisibility'
                  - type: 'null'
                  description: Who caches.
      responses:
        '200':
          description: The folder with the new `cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                name: demo-1794090657532
                public: false
                retention:
                  id: 2
                  name: WEEK
                cache:
                  maxAge: 604800
                  visibility:
                    id: 1
                    name: SHARED
                createdAt: '2026-11-07T22:30:57+00:00'
                updatedAt: '2026-11-07T22:30:57+00:00'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/files:
    post:
      tags:
      - Files
      operationId: uploadFile
      summary: Upload a file
      description: |
        Uploads a file in one `multipart/form-data` request and returns its addresses at once. The
        limit is **32 MiB** for the whole request; larger files go through the chunked upload.

        **The name** is unique within the folder: when taken, a number is added — `photo (1).png`. `/`,
        `\` and control characters are replaced with `-`.

        **Deduplication.** When the bucket already holds this content, no disk space and no quota are
        spent, and the answer says `deduplicated: true`.

        **Image processing.** With `format`, `maxWidth`, `maxHeight`, `quality` the image is shrunk,
        rotated by EXIF and re-encoded before it is stored; the result is what is kept. Images are only
        shrunk, animation is left alone. Changing the format changes the extension too:
        `photo.png` → `photo.webp`.

        **Token:** `FULL`.
      x-token-level: FULL
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file itself.
                folder:
                  type: string
                  maxLength: 100
                  description: Folder name. Without it — the bucket root, and the file is public.
                name:
                  type: string
                  maxLength: 255
                  description: File name. Without it — the name of the uploaded file.
                format:
                  $ref: '#/components/schemas/ImageFormat'
                  description: Output format; `ORIGINAL` — keep.
                maxWidth:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Shrink to this width, keeping proportions.
                maxHeight:
                  type: integer
                  minimum: 16
                  maximum: 10000
                  description: Shrink to this height, keeping proportions.
                quality:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 'Quality; without it — by format: AVIF 55, PNG 60, WEBP and JPEG 82.'
              required:
              - file
      responses:
        '201':
          description: The file is uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              examples:
                upload:
                  summary: success
                  value:
                    id: 60I4PpbPsXVagANk
                    name: photo.png
                    folder: null
                    content:
                      size: 4654
                      mime: image/png
                      extension: png
                      hash: ee300dd3885906657a97edefa78057610a91570d6e594a764fab92c6db518572
                    public: true
                    deduplicated: false
                    processed:
                      applied: false
                      reason: no options
                    expiresAt: null
                    privateUrl: https://s5.example.com/p/60I4PpbPsXVagANk
                    publicUrl: https://s5.example.com/o/2faa480a-4f40-4131-b2ce-5cd6ced969a8/60I4PpbPsXVagANk
                    createdAt: '2026-11-07T22:30:57+00:00'
                    updatedAt: '2026-11-07T22:30:57+00:00'
                upload-image:
                  summary: success
                  value:
                    id: 0FwMWr8RLbjRUCfD
                    name: photo.webp
                    folder: null
                    content:
                      size: 2250
                      mime: image/webp
                      extension: webp
                      hash: 250c33b15669b8b0ceda27d301f46414e4e399ec9f85d9b5f9d34eeddb104381
                    public: true
                    deduplicated: false
                    processed:
                      applied: true
                      operations:
                      - resize:800x533
                      - encode:webp@82
                      source:
                        width: 1200
                        height: 800
                        size: 4654
                        mime: image/png
                      result:
                        width: 800
                        height: 533
                        size: 2250
                        mime: image/webp
                    expiresAt: null
                    privateUrl: https://s5.example.com/p/0FwMWr8RLbjRUCfD
                    publicUrl: https://s5.example.com/o/2faa480a-4f40-4131-b2ce-5cd6ced969a8/0FwMWr8RLbjRUCfD
                    createdAt: '2026-11-07T22:30:57+00:00'
                    updatedAt: '2026-11-07T22:30:57+00:00'
        '400':
          description: No file was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: Uploaded file 'file' is missing
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The token is disabled, expired, or its level is too low.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'Over the bucket quota. A request over 32 MiB gets 413 too, but with no body: the server
            cuts it off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: No image processing, or no encoder for the requested format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The given folder does not exist, validation failed, or the image cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upload:
                  summary: no such folder
                  value:
                    code: 422
                    message: Folder "nope" does not exist
                upload-image:
                  summary: image options on a non-image
                  value:
                    code: 422
                    message: Image options were given, but this file is not an image
    get:
      tags:
      - Files
      operationId: listFiles
      summary: List files
      description: |
        Returns the files of the bucket page by page, with search and sorting.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: page
        in: query
        required: false
        description: Page number, from 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Records per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: search
        in: query
        required: false
        description: Search by name, case-insensitive.
        schema:
          type: string
          maxLength: 255
      - name: folder
        in: query
        required: false
        description: Folder name. An empty value (`folder=`) — the root only. Without it — all files.
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        required: false
        description: Sort field.
        schema:
          type: string
          enum:
          - created
          - name
          - type
          - size
          default: created
      - name: dir
        in: query
        required: false
        description: Direction.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: A page of files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
              example:
                meta:
                  current: 1
                  size: 25
                  total: 4
                  pages: 1
                  previous: null
                  next: null
                data:
                - id: cZtMNnijaQ3Cy1OF
                  name: notes-copy.txt
                  folder: null
                  content:
                    size: 66
                    mime: text/plain
                    extension: txt
                    hash: 2efdc909f33e07505ad104602c9eb3db5de1b54f0562a5c524020c194930599a
                  public: true
                  deduplicated: false
                  processed: null
                  expiresAt: null
                  privateUrl: https://s5.example.com/p/cZtMNnijaQ3Cy1OF
                  publicUrl: https://s5.example.com/o/2faa480a-4f40-4131-b2ce-5cd6ced969a8/cZtMNnijaQ3Cy1OF
                  createdAt: '2026-11-07T22:30:57+00:00'
                  updatedAt: '2026-11-07T22:30:57+00:00'
                - id: tT3q5_AMMrYnVEPp
                  name: notes.txt
                  folder: null
                  content:
                    size: 66
                    mime: text/plain
                    extension: txt
                    hash: 2efdc909f33e07505ad104602c9eb3db5de1b54f0562a5c524020c194930599a
                  public: true
                  deduplicated: false
                  processed: null
                  expiresAt: null
                  privateUrl: https://s5.example.com/p/tT3q5_AMMrYnVEPp
                  publicUrl: https://s5.example.com/o/2faa480a-4f40-4131-b2ce-5cd6ced969a8/tT3q5_AMMrYnVEPp
                  createdAt: '2026-11-07T22:30:57+00:00'
                  updatedAt: '2026-11-07T22:30:57+00:00'
                - id: 0FwMWr8RLbjRUCfD
                  name: photo.webp
                  folder: null
                  content:
                    size: 2250
                    mime: image/webp
                    extension: webp
                    hash: 250c33b15669b8b0ceda27d301f46414e4e399ec9f85d9b5f9d34eeddb104381
                  public: true
                  deduplicated: false
                  processed: null
                  expiresAt: null
                  privateUrl: https://s5.example.com/p/0FwMWr8RLbjRUCfD
