  /v1/uploads/{id}:
    get:
      tags:
      - Chunked upload
      operationId: getUpload
      summary: Check what arrived
      description: |
        The state of the upload: `offset` is how many bytes the server has. After a break, continue from there while the upload has not expired (24 hours after the last chunk).

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Upload id from `POST /v1/uploads`.
        schema:
          type: string
          format: uuid
        example: 9c10a01c-a293-438c-88ba-b48181b9cd67
      responses:
        '200':
          description: The upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                id: b7336f5b-8896-4e90-96e0-df39f22a115a
                name: notes.txt
                size: 66
                offset: 66
                chunkSize: 8388608
                expiresAt: '2026-11-08T22:30:57+00:00'
                file: null
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The upload does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Upload does not exist or has expired
    patch:
      tags:
      - Chunked upload
      operationId: appendChunk
      summary: Send a chunk
      description: |
        Appends the next chunk to the upload. **The body is the raw bytes of the chunk** — not JSON, not
        a form. Repeat until `offset` in the answer equals `size`.

        A chunk is 4 to 16 MiB; only the last one may be smaller. Send `Upload-Offset`: when a chunk is
        lost or sent twice, the server answers `409` instead of producing a corrupted file.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Upload id from `POST /v1/uploads`.
        schema:
          type: string
          format: uuid
        example: 9c10a01c-a293-438c-88ba-b48181b9cd67
      - name: Upload-Offset
        in: header
        required: false
        description: The byte this chunk starts at. Optional, but worth sending.
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        description: The chunk bytes, 4–16 MiB (the last one — any size).
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The chunk is accepted; `offset` is the new position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                id: b7336f5b-8896-4e90-96e0-df39f22a115a
                name: notes.txt
                size: 66
                offset: 66
                chunkSize: 8388608
                expiresAt: '2026-11-08T22:30:57+00:00'
                file: null
        '400':
          description: The chunk is empty, or under 4 MiB and not the last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: 'Chunk is too small: 10 bytes, the minimum is 4194304'
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The upload does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`Upload-Offset` does not match what has arrived.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 409
                message: Chunk offset 4096 does not continue this upload at 0
        '413':
          description: The chunk is over 16 MiB or past the declared `size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Chunked upload
      operationId: cancelUpload
      summary: Cancel an upload
      description: |
        Cancels the upload and deletes what arrived at once. An abandoned upload is deleted anyway: 24 hours after the last chunk, the sweeper removes it within an hour.

        **Token:** `FULL`.
      x-token-level: FULL
      parameters:
      - name: id
        in: path
        required: true
        description: Upload id from `POST /v1/uploads`.
        schema:
          type: string
          format: uuid
        example: 9c10a01c-a293-438c-88ba-b48181b9cd67
      responses:
        '204':
          description: Cancelled, no body.
        '401':
          description: No token, or the token is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The upload does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
