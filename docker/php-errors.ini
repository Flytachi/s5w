; --------------------------
; Errors
; --------------------------
;
; Active in dev and prod alike.

; Keep function arguments out of exception traces.
;
; PHP's compiled-in default is Off, and php.ini-production would turn it On — but this
; image ships no php.ini, so without this line the default stands and every trace
; carries the arguments of every frame on the stack.
;
; That has two consequences, both observed on this application:
;
;   1. Secrets leak. With DEBUG=true the exception trace goes into the JSON error body,
;      so a failed login answered with the submitted password in plain text, three
;      times over — once per frame that passed it along.
;
;   2. Workers die. The chunked upload endpoint takes the request body as an argument,
;      so a rejected chunk put megabytes of binary into the trace. json_encode() cannot
;      encode invalid UTF-8, returned false, and the framework's error responder — typed
;      to return string — raised a TypeError while already handling an error. The worker
;      exited with status 255 and took every request it was holding with it. A plain 413
;      became a fatal.
;
; Turning it On costs the argument list in stack traces. What is actually needed to find
; a bug — class, method, file, line — stays.
zend.exception_ignore_args = 1
