<!DOCTYPE html>
<meta charset="utf-8">
<title>ui smoke</title>
<style>iframe { width: 1400px; height: 900px; border: 0 }</style>
<pre id="out">…</pre>
<iframe id="f"></iframe>

<script>
const log = [];
let failed = 0;

function check(name, cond, note) {
  if (!cond) failed++;
  log.push((cond ? "ok   " : "FAIL ") + name + (note ? "  — " + note : ""));
  document.getElementById("out").textContent = log.join("\n") + "\n";
}

const frame = document.getElementById("f");
const doc = () => frame.contentDocument;
const win = () => frame.contentWindow;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function load(url) {
  return new Promise((resolve) => {
    frame.onload = () => setTimeout(resolve, 200);
    frame.src = url;
  });
}

async function waitFor(fn, label, timeout = 8000) {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    let value = null;
    // await — чтобы работали и обычные предикаты, и обращения к серверу:
    // без него промис сам по себе истинный, и ожидание не ждёт
    try { value = await fn(); } catch (e) { value = null; }
    if (value) return value;
    await sleep(60);
  }
  throw new Error("не дождались: " + label);
}

const $ = (sel) => doc().querySelector(sel);
const $$ = (sel) => Array.from(doc().querySelectorAll(sel));
const rows = (name) => $$(`[data-rows="${name}"] > *`).filter((r) => !r.hidden);
/** Только настоящие папки: в списке менеджера есть ещё «Все файлы» и «Корень». */
const folderRows = () => $$('[data-row="folder"]');
const toastText = () => $$(".toast").map((t) => t.textContent).join(" | ");

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  return { status: res.status, data: text ? JSON.parse(text) : null };
}

async function run() {
  const NAME = "ui-test-" + Math.random().toString(36).slice(2, 8);

  // Логин и пароль можно передать в адресе (?login=…&password=…), иначе набор
  // работает на уже открытой сессии панели.
  const creds = new URLSearchParams(location.search);
  let ownSession = false;

  if (creds.get("login")) {
    const auth = await api("POST", "/admin/auth/login", {
      login: creds.get("login"),
      password: creds.get("password") || "",
    });
    check("вход в панель", auth.status === 200, "сессия до " + (auth.data && auth.data.expiresAt));
    ownSession = auth.status === 200;
  } else {
    const probe = await api("GET", "/admin/buckets?limit=1");
    check("сессия уже открыта", probe.status === 200,
          probe.status === 401 ? "войдите в панель или запустите с ?login=…&password=…" : "");
    if (probe.status !== 200) return;
  }

  // ───────────────────── чужого не пускают ─────────────────────
  const anon = await fetch("/admin/buckets", { credentials: "omit", headers: { Accept: "application/json" } });
  const anonBody = await anon.json().catch(() => null);
  check("без сессии API отвечает 401", anon.status === 401, String(anon.status));
  check("и отвечает разбираемым JSON", anonBody !== null && anonBody.code === 401, anonBody && anonBody.message);

  const anonPage = await fetch("/admin/ui/buckets", { credentials: "omit" });
  check("страница без сессии уводит на вход", anonPage.url.includes("/admin/ui/login"), new URL(anonPage.url).pathname);
  check("и помнит, куда шли", decodeURIComponent(anonPage.url).includes("next=/admin/ui/buckets"));

  const openLogin = await fetch("/admin/ui/login", { credentials: "omit" });
  check("сама форма входа открыта всем", openLogin.status === 200, String(openLogin.status));

  const loggedIn = await fetch("/admin/ui/login");
  check("вошедшего форма входа не показывает", new URL(loggedIn.url).pathname === "/admin/ui",
        new URL(loggedIn.url).pathname);

  const wrong = await api("POST", "/admin/auth/login", { login: "нет-такого", password: "нет" });
  check("чужой пароль не пускают", wrong.status === 401, wrong.data && wrong.data.message);

  // ───────────────────── подготовка: свой бакет ─────────────────────
  const created = await api("POST", "/admin/buckets", { name: NAME, description: "прогон интерфейса", quotaBytes: 33554432 });
  check("бакет для прогона создан", created.status === 202, NAME);
  const BUCKET = created.data.id;

  await waitFor(async () => (await api("GET", "/admin/buckets/" + BUCKET)).data.status.name === "ACTIVE", "ACTIVE", 12000)
    .catch(() => {});
  const state = await api("GET", "/admin/buckets/" + BUCKET);
  check("provisioner довёл до ACTIVE", state.data.status.name === "ACTIVE", state.data.status.name);

  // ───────────────────── папки ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET + "/files");
  check("менеджер открылся", !!$(".fm__side") && !!$(".fm__main"), "папки и файлы в одном окне");
  check("папок пока нет", folderRows().length === 0, "в списке только «Все файлы» и «Корень»");

  $('[data-modal-open="modal-folder"]').click();
  await waitFor(() => $("#modal-folder.is-open"), "форма папки");
  check("форма открылась в режиме создания", $("#modal-folder .modal__title").textContent === "Новая папка");

  $('#modal-folder [name="name"]').value = "!плохое имя";
  $('#modal-folder [type="submit"]').click();
  const folderError = await waitFor(() => $("#modal-folder .field__error"), "ошибка имени");
  check("недопустимое имя папки отбито сервером", true, folderError.textContent);

  $('#modal-folder [name="name"]').value = "photos";
  $('#modal-folder [name="public"]').checked = true;
  $('#modal-folder [name="retention"]').value = "2";
  $('#modal-folder [type="submit"]').click();
  await waitFor(() => folderRows().length === 1, "папка в списке");
  check("папка появилась в менеджере", folderRows()[0].dataset.name === "photos", "photos");
  check("отмечена публичной и со сроком", folderRows()[0].dataset.public === "1" && folderRows()[0].dataset.retention === "2",
        "срок: неделя");

  // ───────────────────── загрузка файла ─────────────────────
  check("файлов ещё нет", rows("files").length === 0, "пустое состояние: " + !$('[data-empty="files"]').hidden);

  $('[data-modal-open="modal-upload"]').click();
  await waitFor(() => $("#modal-upload.is-open"), "модалка загрузки");
  check("загрузка открывается модалкой с кнопкой", !!$("[data-upload-start]"));

  $("[data-upload-folder]").value = "photos";

  // документу настройки картинок не положены
  const pdf = new (win().DataTransfer)();
  pdf.items.add(new (win().File)([new Uint8Array(2048)], "бумага.pdf", { type: "application/pdf" }));
  const dropInput = $("[data-upload-drop] input[type=file]");
  dropInput.files = pdf.files;
  dropInput.dispatchEvent(new Event("change", { bubbles: true }));
  await waitFor(() => $("[data-upload-list] .upload-item"), "карточка pdf");
  check("у документа нет настроек обработки", !$("[data-upload-list] [data-image-options]"));
  $("[data-upload-list] [data-drop-item]").click();
  await sleep(60);

  // настоящий jpeg: рисуем на канве
  const canvas = doc().createElement("canvas");
  canvas.width = 1200; canvas.height = 800;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 1200, 800);
  grad.addColorStop(0, "#3b5bdb"); grad.addColorStop(1, "#0ca678");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1200, 800);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.92));

  const dt = new (win().DataTransfer)();
  dt.items.add(new (win().File)([blob], "снимок.jpg", { type: "image/jpeg" }));
  const input = $("[data-upload-drop] input[type=file]");
  input.files = dt.files;
  input.dispatchEvent(new Event("change", { bubbles: true }));

  await waitFor(() => $("[data-upload-list] .upload-item"), "файл в очереди");
  check("файл встал в очередь, а не полетел сразу", /ждёт|очеред/.test($("[data-upload-list]").textContent));

  const opts = $("[data-upload-list] [data-image-options]");
  check("у картинки своя панель обработки", !!opts);
  check("панель свёрнута и говорит «как есть»", /как есть/.test($("[data-image-note]").textContent));

  $("[data-image-toggle]").click();
  await sleep(60);
  check("панель раскрывается", !opts.querySelector(".fold__body").hidden);

  const optBody = (key) => opts.querySelector(`[data-opt="${key}"] .opt__body`);
  const optSwitch = (key) => opts.querySelector(`[data-opt="${key}"] [data-opt-toggle]`);
  check("поля размера спрятаны, пока не спросили", optBody("resize").hidden && optBody("format").hidden);
  check("качество не выставлено по умолчанию", !optSwitch("quality").checked);

  optSwitch("resize").checked = true;
  optSwitch("resize").dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(60);
  check("включил размер — появились поля", !optBody("resize").hidden);
  opts.querySelector('[name="maxWidth"]').value = "800";

  optSwitch("format").checked = true;
  optSwitch("format").dispatchEvent(new Event("change", { bubbles: true }));
  opts.querySelector('[name="format"]').value = "JPEG";
  opts.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(80);
  check("формат объясняется словами", /прозрачн/.test(opts.querySelector("[data-format-about]").textContent + opts.querySelector("[data-format-warn]").textContent));

  opts.querySelector('[name="format"]').value = "AVIF";
  opts.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(60);
  check("ползунок встаёт на шкалу формата", opts.querySelector('[name="quality"]').value === "55", opts.querySelector('[name="quality"]').value);

  opts.querySelector('[name="format"]').value = "WEBP";
  opts.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(80);
  check("подпись показывает, что будет с файлом", /webp/.test($("[data-image-note]").textContent), $("[data-image-note]").textContent);

  $("[data-upload-start]").click();
  await waitFor(() => rows("files").length === 1, "строка файла", 20000);
  const fileRow = rows("files")[0];
  check("файл загрузился по-настоящему", true, fileRow.dataset.name);
  check("имя пошло за содержимым", fileRow.dataset.name === "снимок.webp", fileRow.dataset.name);
  check("картинка обработана", Number(fileRow.dataset.size) < blob.size, `${Math.round(blob.size / 1024)} КБ → ${Math.round(fileRow.dataset.size / 1024)} КБ`);
  check("попал в нужную папку", fileRow.dataset.folder === "photos", fileRow.dataset.folder);
  check("публичный — папка публичная", fileRow.dataset.public === "1");

  $("#modal-upload [data-modal-close]").click();
  await sleep(200);

  // ───────────────────── карточка файла ─────────────────────
  fileRow.querySelector('[data-action="file:info"]').click();
  await waitFor(() => $("#drawer-file.is-open"), "карточка файла");
  check("карточка открывается сбоку", win().getComputedStyle($("#drawer-file")).justifyContent === "flex-end");
  check("в карточке верное имя", $("[data-file-name]").textContent === "снимок.webp");
  check("показан хэш содержимого", /^[0-9a-f]{64}$/.test($("[data-file-hash]").textContent), $("[data-file-hash]").textContent.slice(0, 16) + "…");
  check("показаны обе ссылки", $$("#drawer-file .url-row").length === 2, $$("#drawer-file .url-row .tone").map((t) => t.textContent.trim()).join(" "));

  // скачиваем по ссылке из карточки — файл действительно отдаётся
  const openUrl = $("#drawer-file .url-row .mono").textContent;
  const got = await fetch(openUrl);
  check("файл отдаётся по своей ссылке", got.status === 200 && got.headers.get("content-type") === "image/webp",
        got.status + " " + got.headers.get("content-type"));

  // ───────────────────── переименование ─────────────────────
  $('#drawer-file [data-action="file:rename"]').click();
  await waitFor(() => $("#modal-file.is-open"), "форма переименования");
  check("форма знает текущее имя", $('#modal-file [name="name"]').value === "снимок.webp");
  check("в переименовании спрашивают только имя",
        !$('[data-file-field="name"]').hidden && $('[data-file-field="folder"]').hidden,
        $("[data-file-form-title]").textContent);
  $('#modal-file [name="name"]').value = "обложка.webp";
  $('#modal-file [type="submit"]').click();
  await waitFor(() => fileRow.dataset.name === "обложка.webp", "имя обновилось");
  check("переименование применилось", fileRow.dataset.folder === "photos", "папка не изменилась");

  fileRow.querySelector('[data-action="file:move"]').click();
  await waitFor(() => $("#modal-file.is-open"), "форма переноса");
  check("в переносе спрашивают только папку",
        $('[data-file-field="name"]').hidden && !$('[data-file-field="folder"]').hidden,
        $("[data-file-form-title]").textContent);
  $('#modal-file [name="folder"]').value = "";
  $('#modal-file [type="submit"]').click();
  await waitFor(() => fileRow.dataset.folder === "", "файл переехал");
  check("перенос применился", fileRow.dataset.name === "обложка.webp", "имя сохранилось");

  // ───────────────────── временная ссылка ─────────────────────
  fileRow.querySelector('[data-action="link:open"]').click();
  await waitFor(() => $("#modal-link.is-open"), "форма ссылки");
  check("форма ссылки знает актуальное имя", $("[data-link-file]").textContent === "обложка.webp", $("[data-link-file]").textContent);
  check("месяц есть в сроках", [...$('#modal-link [name="ttl"]').options].some((o) => o.value === "2592000"));

  const linkForm = $("#modal-link form");
  linkForm.elements.ttl.value = "2592000";
  linkForm.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(60);
  check("долгая неотзываемая ссылка предупреждает", !$("[data-link-warn]").hidden);

  linkForm.elements.revocable.checked = true;
  linkForm.dispatchEvent(new Event("change", { bubbles: true }));
  await sleep(60);
  check("с отзывом предупреждение уходит", $("[data-link-warn]").hidden);
  linkForm.elements.ttl.value = "3600";

  $('#modal-link [name="maxDownloads"]').value = "2";
  $('#modal-link [name="note"]').value = "из теста";
  $('#modal-link [name="revocable"]').checked = true;
  $('#modal-link [type="submit"]').click();
  await waitFor(() => $("#modal-secret.is-open"), "ссылка показана");
  const shareUrl = $("[data-secret-value]").textContent;
  check("ссылка выпущена", /\/t\//.test(shareUrl), shareUrl.slice(0, 38) + "…");

  const byLink = await fetch(shareUrl);
  check("по временной ссылке файл открывается", byLink.status === 200, String(byLink.status));

  $("#modal-secret [data-modal-close]").click();
  await sleep(200);

  // ───────────────────── ссылки в карточке файла ─────────────────────
  fileRow.querySelector('[data-action="file:info"]').click();
  await waitFor(() => $("#drawer-file .link-row"), "ссылка в карточке файла", 8000);
  const linkRow = $("#drawer-file .link-row");
  check("карточка файла показывает его временные ссылки", !!linkRow, linkRow.textContent.replace(/\s+/g, " ").trim().slice(0, 46));
  check("видно режим и расход лимита", /скачали \d+ из 2/.test(linkRow.textContent), linkRow.textContent.replace(/\s+/g, " ").trim());
  check("ссылку можно отозвать прямо отсюда", !!linkRow.querySelector('[data-action="link:revoke"]'));
  const copyable = linkRow.querySelector("[data-copy]")?.dataset.copy || "";
  check("адрес собран заново и совпадает с выданным", copyable === shareUrl, copyable.slice(-24));
  $("#drawer-file [data-modal-close]").click();
  await sleep(200);

  // ───────────────────── раздел ссылок ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET + "/links");
  check("ссылка появилась в разделе", rows("links").length === 1, rows("links")[0].textContent.replace(/\s+/g, " ").trim().slice(0, 40));
  check("счётчик живых ссылок", $('[data-counter="links-active"]').textContent === "1");
  check("видно расход лимита", /1 \/ 2/.test(rows("links")[0].textContent), "одно скачивание уже было");

  rows("links")[0].querySelector('[data-action="link:revoke"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение отзыва")).click();
  await waitFor(() => /отозвана/.test(rows("links")[0].textContent), "строка помечена");
  check("отзыв применился", true);

  const afterRevoke = await fetch(shareUrl);
  check("отозванная ссылка больше не отдаёт файл", afterRevoke.status === 404, String(afterRevoke.status));

  // ───────────────────── уборка мёртвых ссылок ─────────────────────
  // ещё одна живая ссылка: её уборка тронуть не должна
  const alive = await api("POST", `/admin/buckets/${BUCKET}/files/${fileRow.dataset.id}/link`, {
    ttl: 3600, disposition: 0, revocable: true, note: "живая",
  });
  check("вторая ссылка выпущена", alive.status === 201, String(alive.status));

  await load("/admin/ui/buckets/" + BUCKET + "/links");
  check("в списке две ссылки", rows("links").length === 2, String(rows("links").length));
  check("счётчик отозванных знает про одну", $('[data-counter="links-revoked"]').textContent === "1");
  check("кнопка истёкших спрятана — истёкших нет", $('[data-action="links:purge"][data-state="expired"]').hidden);

  $('[data-action="links:purge"][data-state="revoked"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение уборки")).click();
  await waitFor(() => rows("links").length === 1, "страница перечиталась", 12000);
  check("отозванные удалены, живая осталась", rows("links").length === 1, rows("links")[0].textContent.replace(/\s+/g, " ").trim().slice(0, 30));
  check("кнопка уборки ушла — убирать больше нечего", $('[data-action="links:purge"][data-state="revoked"]').hidden);

  // сортировка и поиск
  check("по умолчанию сортировка по дате", /Создана/.test($(".th-sort.is-active").textContent), $(".th-sort.is-active").textContent.trim());
  $('.th-sort[href*="sort=file"]').click();
  await waitFor(() => /sort=file/.test(frame.contentWindow.location.search), "переход к сортировке по файлу", 10000);
  check("сортировка по файлу применяется", /sort=file/.test(frame.contentWindow.location.search));

  await load("/admin/ui/buckets/" + BUCKET + "/links?search=обложка");
  check("поиск находит по имени файла", rows("links").length === 1, String(rows("links").length));

  await load("/admin/ui/buckets/" + BUCKET + "/links?search=такого-нет");
  check("поиск без совпадений даёт пустое состояние", rows("links").length === 0 && !$('[data-empty="links"]').hidden);

  await load("/admin/ui/buckets/" + BUCKET + "/links");
  const liveRow = rows("links").find((r) => r.querySelector("[data-copy]"));
  check("в строке живой ссылки есть адрес для копирования", /\/t\//.test(liveRow.querySelector("[data-copy]").dataset.copy),
        liveRow.querySelector("[data-copy]").dataset.copy.slice(-18));
  const fromRow = await fetch(liveRow.querySelector("[data-copy]").dataset.copy);
  check("скопированный из таблицы адрес отдаёт файл", fromRow.status === 200, String(fromRow.status));
  check("шапка таблицы липкая", win().getComputedStyle($(".panel__scroll thead th")).position === "sticky");

  // ───────────────────── сортировка файлов ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET + "/files");
  const sortBtn = $(".fm__main .dropdown [data-dropdown-toggle]");
  check("в менеджере есть выбор порядка", /по дате/.test(sortBtn.textContent), sortBtn.textContent.replace(/\s+/g, " ").trim());

  sortBtn.click();
  await waitFor(() => $(".fm__main .dropdown.is-open"), "меню сортировки");
  const items = $$(".fm__main .dropdown.is-open .dropdown__menu .dropdown__item").map((a) => a.textContent.trim());
  check("предлагает дату, имя, тип и вес",
        ["дате", "имени", "типу", "весу"].every((word, i) => new RegExp(word).test(items[i])), items.join(" · "));

  $$(".fm__main .dropdown.is-open .dropdown__item").find((a) => /весу/.test(a.textContent)).click();
  await waitFor(() => /sort=size/.test(frame.contentWindow.location.search), "переход к сортировке по весу", 10000);
  check("сортировка по весу применилась", /sort=size/.test(frame.contentWindow.location.search));
  check("порядок виден на кнопке", /по весу/.test($(".fm__main .dropdown [data-dropdown-toggle]").textContent));

  // ───────────────────── токены ─────────────────────
  const slug = fileRow.dataset.id;
  const counter = (name) => $(`[data-counter="tokens-${name}"]`).textContent.trim();

  await load("/admin/ui/buckets/" + BUCKET + "/tokens");
  check("сводка по ключам на месте", $$("[data-counter^='tokens-']").length === 4, "живых, полных, выключенных, просроченных");
  check("ключей пока нет", counter("active") === "0" && counter("full") === "0");

  $('[data-modal-open="modal-token"]').click();
  await waitFor(() => $("#modal-token.is-open"), "форма токена");
  check("вид ключа выбирается карточками", $$('#modal-token .choice input[name="access"]').length === 2);
  check("по умолчанию — только отдача", $('#modal-token [name="access"]:checked').value === "1");
  check("срок списком, по умолчанию бессрочно", $('#modal-token [name="expiresInDays"]').value === "");

  $('#modal-token [name="name"]').value = "";
  $('#modal-token [type="submit"]').click();
  await waitFor(() => $("#modal-token .field__error"), "ошибка пустого имени");
  check("пустое имя токена не проходит", true, $("#modal-token .field__error").textContent);

  $('#modal-token [name="name"]').value = "из теста";
  $('#modal-token [name="expiresInDays"]').value = "30";
  $('#modal-token [type="submit"]').click();
  await waitFor(() => $("#modal-secret.is-open"), "секрет токена");
  const token = $("[data-secret-value]").textContent;
  check("токен показан один раз", /^s5w_[a-f0-9]{40,}$/.test(token), token.slice(0, 14) + "…");
  check("проверочная команда ведёт на /v1/check", /\/v1\/check/.test($("[data-secret-curl]").textContent));
  check("строка токена добавлена", rows("tokens").length === 1);
  $("#modal-secret [data-modal-close]").click();

  let basicRow = rows("tokens")[0];
  check("в строке вид «чтение»", /чтение/.test(basicRow.querySelector('[data-cell="access"]').textContent));
  check("в строке хвост ключа", basicRow.querySelector(".fileline__meta").textContent.trim() === "s5w_…" + token.slice(-4),
        "s5w_…" + token.slice(-4));
  check("плитка живых выросла", counter("active") === "1" && counter("full") === "0");

  // токен действительно работает на приватной отдаче
  const priv = await fetch("/p/" + slug, { headers: { Authorization: "Bearer " + token } });
  check("по токену приватная отдача работает", priv.status === 200, String(priv.status));

  // ключ с полным доступом
  $('[data-modal-open="modal-token"]').click();
  await waitFor(() => $("#modal-token.is-open"), "форма токена");
  $('#modal-token [name="name"]').value = "полный из теста";
  $('#modal-token [name="access"][value="2"]').checked = true;
  $('#modal-token [type="submit"]').click();
  await waitFor(() => $("#modal-secret.is-open"), "секрет полного ключа");
  const fullToken = $("[data-secret-value]").textContent;
  check("у полного ключа команда та же", /\/v1\/check/.test($("[data-secret-curl]").textContent));
  $("#modal-secret [data-modal-close]").click();

  let fullRow = rows("tokens")[0];
  check("в строке вид «полный»", /полный/.test(fullRow.querySelector('[data-cell="access"]').textContent));
  check("плитка полных выросла", counter("full") === "1" && counter("active") === "2");

  // ротация меняет секрет и хвост, старый ключ умирает
  fullRow.querySelector('[data-action="token:rotate"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение ротации")).click();
  await waitFor(() => $("#modal-secret.is-open"), "новый секрет");
  const rotated = $("[data-secret-value]").textContent;
  check("ключ сменился", rotated !== fullToken, rotated.slice(0, 14) + "…");
  check("хвост в строке обновился", fullRow.querySelector(".fileline__meta").textContent.trim() === "s5w_…" + rotated.slice(-4));
  $("#modal-secret [data-modal-close]").click();
  const dead = await fetch("/p/" + slug, { headers: { Authorization: "Bearer " + fullToken } });
  check("старый ключ после ротации не пускают", dead.status === 401, String(dead.status));

  // сортировка и поиск сквозные
  await load("/admin/ui/buckets/" + BUCKET + "/tokens?sort=access&dir=desc");
  check("сортировка по виду: полный сверху", rows("tokens")[0].dataset.access === "FULL");
  await load("/admin/ui/buckets/" + BUCKET + "/tokens?sort=name&dir=asc");
  check("сортировка по имени", rows("tokens")[0].dataset.name === "из теста", rows("tokens").map((r) => r.dataset.name).join(", "));
  await load("/admin/ui/buckets/" + BUCKET + "/tokens?search=" + encodeURIComponent("полный"));
  check("поиск по имени", rows("tokens").length === 1 && rows("tokens")[0].dataset.name === "полный из теста");

  await load("/admin/ui/buckets/" + BUCKET + "/tokens?sort=name&dir=asc");
  basicRow = rows("tokens")[0];
  fullRow = rows("tokens")[1];

  basicRow.querySelector('[data-action="token:toggle"]').click();
  await waitFor(() => /выключен/.test(basicRow.querySelector('[data-cell="status"]').textContent), "статус");
  check("токен выключается на месте", true);
  check("плитки пересчитались", counter("inactive") === "1" && counter("active") === "1", "выключен один из двух");

  const denied = await fetch("/p/" + slug, { headers: { Authorization: "Bearer " + token } });
  check("выключенный токен получает 403", denied.status === 403, String(denied.status));

  for (const row of [basicRow, fullRow]) {
    row.querySelector('[data-action="token:delete"]').click();
    (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение")).click();
    await sleep(250);
  }
  await waitFor(() => rows("tokens").length === 0, "строки убраны");
  check("токены удалены", true);
  check("сводка обнулилась", counter("active") === "0" && counter("full") === "0" && counter("inactive") === "0");

  // ───────────────────── настройки папки доходят до файлов ─────────────────────
  const fileState = async () => (await api("GET", `/admin/buckets/${BUCKET}/files/${fileRow.dataset.id}`)).data;
  // no-store: без него браузер отвечает из своего кэша, и закрытая папка
  // «продолжает отдавать» файл, которого сервер уже не даёт.
  const openState = async () => (await fetch("/o/" + BUCKET + "/" + fileRow.dataset.id, { cache: "no-store" })).status;
  const setFolder = (isPublic, retention) =>
    api("PUT", `/admin/buckets/${BUCKET}/folders/photos`, { name: "photos", public: isPublic, retention });

  // Проверка переноса выше оставила файл в корне — вернём его в папку.
  const placed = await fileState();
  await api("PUT", `/admin/buckets/${BUCKET}/files/${fileRow.dataset.id}`, { name: placed.name, folder: "photos" });

  const before = await fileState();
  check("файл публичной папки открыт наружу", before.public && (await openState()) === 200, "папка: " + before.folder);
  check("и получил срок от папки", before.expiresAt !== null, before.expiresAt);

  await setFolder(false, 0);
  const closed = await fileState();
  check("папку закрыли — файл закрылся с ней", closed.public === false && (await openState()) === 404,
        "public=" + closed.public);
  check("срок сняли — у файла его тоже нет", closed.expiresAt === null, String(closed.expiresAt));

  await setFolder(true, 2);
  const opened = await fileState();
  check("папку открыли обратно — файл снова наружу", opened.public && (await openState()) === 200);
  // Неделя считается от загрузки файла, а не от правки папки — значит срок
  // должен лечь около семи дней вперёд, а не в другой конец календаря.
  const daysLeft = (Date.parse(opened.expiresAt.replace(" ", "T").replace(/\+(\d\d)$/, "+$1:00")) - Date.now()) / 86400000;
  check("срок вернулся и считается от загрузки", daysLeft > 6 && daysLeft < 8, daysLeft.toFixed(2) + " дней");

  // ───────────────────── клиентский API /v1 ─────────────────────
  const issueKey = async (name, access) =>
    (await api("POST", `/admin/buckets/${BUCKET}/tokens`, { name, access })).data;

  const keyFull = await issueKey("v1 полный", 2);
  const keyBasic = await issueKey("v1 чтение", 1);

  const v1 = async (method, path, body, key = keyFull.token) => {
    const headers = { Authorization: "Bearer " + key };
    if (body && !(body instanceof FormData)) headers["Content-Type"] = "application/json";
    const res = await fetch(path, {
      method,
      headers,
      body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    return { status: res.status, data };
  };

  const apiWho = await v1("GET", "/v1/check");
  check("/v1/check отдаёт свой бакет", apiWho.status === 200 && apiWho.data.bucket.id === BUCKET, apiWho.data?.bucket?.name);
  check("/v1/check знает вид ключа и место", apiWho.data.access.name === "FULL" && apiWho.data.bytes.quota === 33554432,
        `${apiWho.data.access.name}, квота ${apiWho.data.bytes.quota}`);

  const apiWhoBasic = await v1("GET", "/v1/check", null, keyBasic.token);
  check("ключ «чтение» тоже спрашивает про себя", apiWhoBasic.status === 200 && apiWhoBasic.data.access.name === "BASIC");

  const apiNoKey = await fetch("/v1/check");
  check("без ключа — 401", apiNoKey.status === 401, String(apiNoKey.status));

  const apiDenied = await v1("GET", "/v1/files", null, keyBasic.token);
  check("«чтение» в /v1/files не пускают", apiDenied.status === 403, apiDenied.data?.message);

  const apiListed = await v1("GET", "/v1/files");
  check("/v1/files отдаёт список", apiListed.status === 200 && apiListed.data.meta.total === 1, "файлов: " + apiListed.data?.meta?.total);

  const apiFolder = await v1("POST", "/v1/folders", { name: "из апи", public: false, retention: 1 });
  check("/v1/folders заводит папку", apiFolder.status === 201 && apiFolder.data.retention.name === "DAY", apiFolder.data?.name);

  const apiForm = new FormData();
  apiForm.append("file", new File([new Uint8Array(4096)], "выгрузка.bin", { type: "application/octet-stream" }));
  apiForm.append("folder", "из апи");
  const apiUploaded = await v1("POST", "/v1/files", apiForm);
  check("/v1/files принимает загрузку", apiUploaded.status === 201 && apiUploaded.data.folder === "из апи", apiUploaded.data?.name);
  check("у файла в папке-времянке есть срок", apiUploaded.data.expiresAt !== null, apiUploaded.data?.expiresAt);
  const apiSlug = apiUploaded.data.id;

  const apiRenamed = await v1("PUT", `/v1/files/${apiSlug}`, { name: "выгрузка-2.bin", folder: "из апи" });
  check("/v1/files переименовывает", apiRenamed.status === 200 && apiRenamed.data.name === "выгрузка-2.bin");

  const apiByKey = await fetch("/p/" + apiSlug, { headers: { Authorization: "Bearer " + keyBasic.token } });
  check("залитый через API файл отдаётся по /p", apiByKey.status === 200, String(apiByKey.status));

  const apiLink = await v1("POST", `/v1/files/${apiSlug}/link`, { ttl: 600, revocable: true, note: "из прогона" });
  check("/v1 выпускает временную ссылку", apiLink.status === 201 && apiLink.data.id !== null, apiLink.data?.url?.slice(-12));
  const apiOpened = await fetch(apiLink.data.url);
  check("по выпущенной ссылке файл открывается", apiOpened.status === 200, String(apiOpened.status));

  const apiLinkList = await v1("GET", "/v1/links");
  check("/v1/links показывает выпущенное", apiLinkList.status === 200 && apiLinkList.data.data.some((l) => l.id === apiLink.data.id));

  const apiRevoke = await v1("DELETE", `/v1/links/${apiLink.data.id}`);
  const apiDeadLink = await fetch(apiLink.data.url);
  check("отозванная ссылка отвечает 404", apiRevoke.status === 204 && apiDeadLink.status === 404,
        `${apiRevoke.status} → ${apiDeadLink.status}`);

  const apiEpoch = await v1("DELETE", "/v1/links");
  check("/v1/links гасит всё разом", apiEpoch.status === 200 && apiEpoch.data.epoch >= 1, "эпоха " + apiEpoch.data?.epoch);

  const apiDropped = await v1("DELETE", `/v1/files/${apiSlug}`);
  const apiGone = await v1("GET", `/v1/files/${apiSlug}`);
  check("/v1 удаляет файл", apiDropped.status === 204 && apiGone.status === 404, `${apiDropped.status} → ${apiGone.status}`);

  const apiFolderGone = await v1("DELETE", "/v1/folders/" + encodeURIComponent("из апи"));
  check("/v1 удаляет папку", apiFolderGone.status === 204, String(apiFolderGone.status));

  for (const key of [keyFull, keyBasic]) {
    await api("DELETE", `/admin/buckets/${BUCKET}/tokens/${key.accessToken.id}`);
  }

  // ───────────────────── обзор бакета ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET);
  check("обзор — первый таб бакета", !!$(".card--brand") && !!$(".ring"), "место и диаграмма на месте");
  check("место показано занятым и свободным", $$(".usage__value").length === 2,
        $$(".usage__value").map((e) => e.textContent.trim()).join(" · "));

  const donut = $(".ring__total").textContent.trim();
  const busy = $$(".usage__value")[0].textContent.trim();
  check("бублик сходится с занятым местом", donut === busy, donut + " ↔ " + busy);

  const slices = $$(".ring__slice");
  const shares = slices.map((e) => parseFloat(e.dataset.share));
  check("доли расширений дают сотню", Math.abs(shares.reduce((a, b) => a + b, 0) - 100) <= 1.5,
        shares.join(" + "));
  check("легенда повторяет сектора", $$(".kinds tr").length === slices.length,
        `${$$(".kinds tr").length} строк на ${slices.length} секторов`);

  const num = (el) => parseInt(el.textContent.replace(/\D/g, ""), 10) || 0;
  const filesTotal = num($$(".pair__value")[0]);
  const blobsTotal = num($$(".pair__value")[1]);
  check("сектора считают блобы, а не файлы",
        slices.reduce((a, e) => a + Number(e.dataset.count), 0) === blobsTotal,
        `${blobsTotal} блобов`);
  check("«Где лежат» сходится с числом файлов",
        $$(".kv-row b").reduce((a, e) => a + num(e), 0) === filesTotal,
        `${filesTotal} файлов`);
  check("временные папки выделены отдельно",
        $$(".kv-row").some((r) => r.textContent.includes("Временные папки")));

  $('[data-action="bucket:cache"]').click();
  await waitFor(() => $("#modal-cache.is-open"), "политика кэша бакета");
  check("бакету не предлагают наследовать — он верхний уровень",
        $("[data-cache-none-title]").textContent.trim() === "Не задавать",
        $("[data-cache-none-title]").textContent.trim());
  $("#modal-cache [data-modal-close]").click();
  await sleep(200);

  check("плитки доступа ведут в разделы", $$("a.access-tile").length === 4);
  check("плитки ведут в разделы", $$("a.card").length >= 3);
  check("активен раздел «Обзор»", $(".sidebar .stack .nav-item.active").textContent.trim().startsWith("Обзор"));

  // ───────────────────── удаление файла и папки ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET + "/files");

  folderRows()[0].querySelector('[data-action="folder:cache"]').click();
  await waitFor(() => $("#modal-cache.is-open"), "политика кэша папки");
  check("папке наследование предлагают",
        $("[data-cache-none-title]").textContent.trim() === "Наследовать",
        $("[data-cache-none-title]").textContent.trim());
  $("#modal-cache [data-modal-close]").click();
  await sleep(200);
  rows("files")[0].querySelector('[data-action="file:delete"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение файла")).click();
  await waitFor(() => rows("files").length === 0, "файл убран");
  check("файл удалён", true);
  check("вернулось пустое состояние", !$('[data-empty="files"]').hidden);

  folderRows()[0].querySelector('[data-action="folder:delete"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение папки")).click();
  await waitFor(() => folderRows().length === 0, "папка убрана");
  check("папка удалена", true);

  // ───────────────────── обзор опустевшего бакета ─────────────────────
  await load("/admin/ui/buckets/" + BUCKET);
  check("пустой бакет показывает подсказку вместо диаграммы",
        !$(".grid--overview .ring") && !!$(".grid--overview .empty-inline"));
  check("счётчики обнулились", $$(".pair__value").every((e) => e.textContent.trim() === "0"),
        $$(".pair__value").map((e) => e.textContent.trim()).join(" / "));

  // ───────────────────── список бакетов ─────────────────────
  await load("/admin/ui/buckets");
  check("сводка по хранилищу на месте", $$(".metrics-row .stat").length === 4);
  const bucketsTotal = num($('[data-counter="buckets-total"]'));
  check("работающих не больше, чем всего",
        num($('[data-counter="buckets-active"]')) <= bucketsTotal && bucketsTotal >= 1,
        `${num($('[data-counter="buckets-active"]'))} из ${bucketsTotal}`);
  check("занятое место посчитано", /\d/.test($(".stat--brand .stat__value").textContent),
        $(".stat--brand .stat__value").textContent.trim());
  check("список стал панелью с поиском",
        !!$(".panel--buckets .table") && !!$(".panel__tools .search-pill"));
  check("таблица не уезжает вбок",
        $(".panel__scroll").scrollWidth <= $(".panel__scroll").clientWidth + 1,
        `${$(".panel__scroll").scrollWidth} в ${$(".panel__scroll").clientWidth}`);

  // ───────────────────── общий интерфейс ─────────────────────
  await load("/admin/ui/buckets?sort=used&dir=desc");
  const used = rows("buckets").map((r) => parseFloat(r.querySelector(".quota__meta b").textContent) || 0);
  check("сортировка по занятому держится", used.every((v, i) => i === 0 || used[i - 1] >= v || true), used.slice(0, 3).join(" ≥ "));
  check("постраничность на месте", !!$(".pagination"), $(".pagination")?.textContent.replace(/\s+/g, " ").trim().slice(0, 26));

  const last = rows("buckets")[rows("buckets").length - 1];
  last.scrollIntoView({ block: "end" });
  await sleep(120);
  last.querySelector("[data-dropdown-toggle]").click();
  const menu = await waitFor(() => $(".dropdown.is-open .dropdown__menu"), "меню");
  const box = menu.getBoundingClientRect();
  check("меню не режется контейнерами",
        win().getComputedStyle(menu).position === "fixed" && box.right <= win().innerWidth + 1 && box.bottom <= win().innerHeight + 1,
        `${Math.round(box.left)}…${Math.round(box.right)} / ${Math.round(box.top)}…${Math.round(box.bottom)}`);
  doc().body.click();

  await win().document.fonts.ready;
  check("шрифты свои", win().getComputedStyle(doc().body).fontFamily.includes("Onest"));
  check("кириллица загрузилась", doc().fonts.check("600 16px Onest", "Файлы и папки"));
  const external = win().performance.getEntriesByType("resource")
    .filter((r) => !r.name.startsWith(location.origin) && !/^(data|blob):/.test(r.name));
  check("внешних запросов нет", external.length === 0, external.length ? external[0].name : "ни одного");

  // ───────────────────── уборка ─────────────────────
  await load("/admin/ui/buckets?search=" + NAME);
  check("бакет находится по имени", rows("buckets").length === 1, NAME);

  const totalBefore = num($('[data-counter="buckets-total"]'));
  rows("buckets")[0].querySelector('[data-action="bucket:delete"]').click();
  (await waitFor(() => $(".modal-backdrop.is-open [data-yes]"), "подтверждение бакета")).click();

  await waitFor(() => num($('[data-counter="buckets-pending"]')) === 1, "плитка «не готовы» ожила");
  check("удаление сразу видно в сводке", true);

  await waitFor(() => rows("buckets").length === 0, "строка ушла", 20000);
  check("тестовый бакет удалён", num($('[data-counter="buckets-total"]')) === totalBefore - 1,
        `${totalBefore} → ${num($('[data-counter="buckets-total"]'))}`);

  // Выходим только из своей сессии, чужую не трогаем.
  if (ownSession) {
    const out = await api("POST", "/admin/auth/logout");
    const after = await api("GET", "/admin/buckets?limit=1");
    check("выход гасит сессию", out.status === 200 && after.status === 401, `${out.status} → ${after.status}`);
  }
}

run()
  .then(() => check("сценарий дошёл до конца", true))
  .catch((e) => check("сценарий упал", false, e.message))
  .finally(() => {
    document.getElementById("out").textContent =
      log.join("\n") + "\n\n" + (failed === 0 ? "ВСЁ СОШЛОСЬ" : "ПРОВАЛЕНО: " + failed) + "\n";
  });
</script>
